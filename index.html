<main>

</section>

<section id="asobu" class="block">
  <h2><span class="en">PLAY</span>あそぶ</h2>
  <div class="cards">
    <a class="card" href="sakedrop/">
      <span class="art"><img src="img/art/label_sakedrop.jpg" alt="酒器おとし" width="480" height="640" loading="lazy"></span>

<section class="block about">
  <h2><span class="en">ABOUT</span>サケノテについて</h2>
  <p>合同会社サケノテは、日本酒業界に特化した会社です。コンサルティングや商品開発のお手伝い、日本酒の魅力の発信をしています。ここに並べるのは、醸造の知識を形にしたものです。</p>

  <div class="share">
    <p class="share-ttl">このページを送る</p>
    <div class="share-btns">

      <a class="btn btn-x" href="https://twitter.com/intent/tweet?url=https%3A%2F%2Flab.sakenote.net%2F&amp;text=SAKENOTE%20LAB%EF%BD%9C%E5%90%88%E5%90%8C%E4%BC%9A%E7%A4%BE%E3%82%B5%E3%82%B1%E3%83%8E%E3%83%86">X</a>
      <button class="btn" type="button" id="copy" data-url="https://lab.sakenote.net/">リンクをコピー</button>
    </div>
    <p class="copied" id="copied" role="status" aria-live="polite"></p>
  </div>
</section>

<footer class="site-foot">

  <p><a href="https://sakenote.net/">‹ 合同会社サケノテ</a></p>
</footer>

<script>
(function () {
  var b = document.getElementById('copy'), m = document.getElementById('copied');
  b.addEventListener('click', function () {
    var u = b.getAttribute('data-url');
    function done(ok) { m.textContent = ok ? 'コピーしました' : u; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(u).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  });
})();
</script>
