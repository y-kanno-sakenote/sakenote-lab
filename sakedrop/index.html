  body{color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho",serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  #hud{width:100%;max-width:420px;display:flex;align-items:center;justify-content:space-between;height:52px;flex:0 0 auto;padding:0 10px;margin-bottom:6px;
    background:rgba(60,40,20,.38);border-radius:8px;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  #hud .lbl{color:#e6d6bc}
  .lbl{font-size:12px;color:var(--sub)}
  .val{font-size:22px;line-height:1.1}
  #hudL .val .lbl{font-size:12px}
  #bestRow{margin-top:2px;font-variant-numeric:tabular-nums}
  #nextWrap{display:flex;align-items:center;gap:6px}
  #nextCv{width:56px;height:56px}
  #hudR{display:flex;align-items:center;gap:12px}
  #snd{font:inherit;font-size:22px;line-height:1;width:40px;height:40px;border:0;border-radius:8px;background:rgba(0,0,0,.25);color:var(--ink);cursor:pointer;touch-action:manipulation}
  #stage{flex:1 1 auto;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:0}
  #cv{display:block;touch-action:none}
  /* 箱の下の器の順番（小→大）。絵の大きさも段ごとに少しずつ大きく */
  #ladder{flex:0 0 auto;height:34px;margin-top:8px;display:flex;align-items:flex-end}
  #ladder span{flex:1;min-width:0;display:flex;justify-content:center;align-items:flex-end}
  #ladder img{display:block;max-width:100%;object-fit:contain;image-rendering:pixelated}
  body.top #ladder{visibility:hidden}
  #over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,16,12,.72)}
  #over.on{display:flex}
  .card{background:var(--panel);padding:24px 28px;border-radius:12px;text-align:center;min-width:220px}
  .card h2{font-size:22px;margin-bottom:14px;font-weight:normal}
  .card p{margin:6px 0;font-size:16px}
  .card button{margin-top:16px;font:inherit;font-size:18px;padding:10px 24px;border:0;border-radius:8px;background:#b5651d;color:#fff}
  .card .big{font-size:48px;line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
  .card .rank{color:#f0c27a}
  .card #oBestRow{color:var(--sub)}
  .card .link{display:block;margin:14px auto 0;padding:4px 8px;background:none;color:#e6d6bc;font-size:14px;text-decoration:underline;text-underline-offset:3px}
  /* トップ画面 */
  #top{position:fixed;inset:0;z-index:10;display:none;overflow-y:auto;background:rgba(28,20,12,.35);-webkit-backdrop-filter:saturate(.6);backdrop-filter:saturate(.6)}
  body.top #top{display:flex}
  #topIn{position:relative;width:100%;height:667px;flex:0 0 auto;margin:auto 0}

  #tGo{position:absolute;top:256px;left:50%;width:200px;height:56px;margin-left:-100px;border:0;border-radius:28px;background:#c0392b;color:#f3ece0;font:inherit;font-size:22px;cursor:pointer;touch-action:manipulation;box-shadow:0 2px 0 #2a2621}
  #tHowBtn{position:absolute;top:326px;left:50%;width:200px;height:44px;margin-left:-100px;border:1px solid rgba(243,236,224,.6);border-radius:22px;background:rgba(28,20,12,.45);color:#f3ece0;font:inherit;font-size:18px;cursor:pointer;touch-action:manipulation}
  #tBest{position:absolute;top:400px;left:50%;width:160px;margin-left:-80px;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  #tBest h3{font-size:12px;font-weight:normal;color:#e6d6bc;text-align:center;margin-bottom:4px}
  #tBest ol{list-style:none}
  #tBest li{display:flex;justify-content:center;gap:20px;height:22px;line-height:22px;font-size:16px;padding:0 6px;border-radius:4px;font-variant-numeric:tabular-nums}
  #tBest li.fresh{animation:fresh 1.6s ease-out 1}
  @keyframes fresh{0%,30%{background:rgba(240,194,122,.45)}100%{background:rgba(240,194,122,0)}}
  /* 遊び方ページ（トップから開く） */
  #how{position:fixed;inset:0;z-index:11;display:none;overflow-y:auto;background:rgba(20,16,12,.82)}
  body.how #how{display:block}
  body.how #topIn{visibility:hidden}
  #howIn{width:100%;max-width:360px;margin:0 auto;padding:56px 16px 32px;color:#f3ece0;text-shadow:0 1px 2px rgba(0,0,0,.75)}
  #howIn h2{font-size:24px;font-weight:normal;text-align:center;margin-bottom:16px}
  #howIn h3{font-size:14px;font-weight:normal;color:#e6d6bc;margin:22px 0 8px}
  #hSteps{list-style-position:inside;padding-left:0;font-size:16px;line-height:1.7}
  #hLadder{list-style:none;display:grid;grid-template-columns:repeat(6,1fr);gap:8px 2px}
  #hLadder li{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;font-size:11px;color:#e6d6bc;white-space:nowrap}
  #hLadder img{width:40px;height:40px;object-fit:contain;image-rendering:pixelated}
  #hSpecial{list-style:none;font-size:15px;line-height:1.6}
  #hSpecial li{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
  #hSpecial img{width:36px;height:36px;flex:0 0 36px;image-rendering:pixelated}
  #hSpecial b{font-weight:normal;color:#f0c27a}
  #hBack{display:block;margin:24px auto 0;width:160px;height:44px;border:0;border-radius:22px;background:#c0392b;color:#f3ece0;font:inherit;font-size:18px;cursor:pointer;touch-action:manipulation}
  /* トップの間はゲームの画面を隠し、🔈 だけ同じ場所に残す */
  body.top #hud{background:transparent}
  body.top #hud > div:not(#hudR), body.top #hudR > div, body.top #stage{visibility:hidden}
  /* 🔈 はトップの幕・終わりの幕（#over）より上に出し、いつでも押せるように */
  #snd{position:relative;z-index:20}
</style>
</head>
<body class="top">
<div id="app">
  <div id="hud">
    <div id="hudL"><div class="val"><span class="lbl">点</span> <span id="score">0</span></div><div class="lbl" id="bestRow">最高 <span id="best">0</span></div></div>
    <div id="hudR"><div id="nextWrap"><div class="lbl">つぎ</div><canvas id="nextCv" width="112" height="112"></canvas></div>
      <button id="snd" type="button" aria-label="音を消す">🔈</button></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas><div id="ladder" aria-hidden="true"></div></div>
</div>
<div id="top"><div id="topIn">
  <h1 id="tTitle"></h1>
  <button id="tGo" type="button">はじめる</button>
  <button id="tHowBtn" type="button">遊び方</button>
  <div id="tBest"><h3>ベスト</h3><ol id="tList"></ol></div>
</div></div>
<div id="how"><div id="howIn">
  <h2>遊び方</h2>
  <ol id="hSteps">
    <li>指でねらって、はなすと器が落ちる</li>
    <li>同じ器がくっつくと、一段大きい器になる</li>
    <li>器が線をこえてあふれたら終わり</li>
  </ol>
  <h3>器の順番</h3>
  <ol id="hLadder"></ol>
  <h3>ときどき落ちてくる</h3>
  <ul id="hSpecial">
    <li><img id="hSugi" alt=""><span><b>杉玉</b>　触れた器を一段育てて消える</span></li>
    <li><img id="hNomi" alt=""><span><b>酔っ払い</b>　一升瓶以上の器を一段小さくして消える</span></li>
  </ul>
  <button id="hBack" type="button">もどる</button>
</div></div>
<div id="over"><div class="card">
  <h2>あふれました</h2>
  <p class="big" id="oScore">0</p>
  <p class="rank" id="oRank"></p>
  <p id="oBestRow">最高 <span id="oBest">0</span></p>
  <button id="again">もう一度</button>
  <button id="toTop" class="link" type="button">トップへ</button>
</div></div>

  Object.keys(SPRITES).forEach(function (k) {
    var im = new Image();
    im.onload = function () { lastNext = -1; };  // 読み込み後に予告欄を描き直す

  // 器の順番：箱の下の帯と遊び方ページ
  (function () {
    var lad = document.getElementById('ladder'), hl = document.getElementById('hLadder'), n = C.NAMES.length;
    for (var t = 0; t < n; t++) {
      var im = new Image(); im.src = SPRITES[String(t)].src; im.alt = '';
      var px = Math.round(16 + 14 * t / (n - 1)); im.style.width = im.style.height = px + 'px';
      var cell = document.createElement('span'); cell.appendChild(im); lad.appendChild(cell);
      var li = document.createElement('li'), im2 = new Image(); im2.src = im.src; im2.alt = '';
      li.appendChild(im2); li.appendChild(document.createTextNode(C.NAMES[t])); hl.appendChild(li);
    }
    document.getElementById('hSugi').src = SPRITES['-1'].src;
    document.getElementById('hNomi').src = SPRITES['-2'].src;
  })();

  function drawPiece(g, piece, x, y, r, alpha) {
    var sp = SPRITES[String(piece)];
    if (!sp || !sp.img.complete || !sp.img.naturalWidth) return;
    var w = sp.img.naturalWidth, h = sp.img.naturalHeight, k = r / C.SPRITE_M[String(piece)];
    g.save();
    g.globalAlpha = alpha == null ? 1 : alpha;
    g.imageSmoothingEnabled = false;
    g.drawImage(sp.img, x - w * k / 2, y - h * k / 2, w * k, h * k);
    g.restore();
  }

  // 箱の中の物：絵の中心 (b.x,b.y) で body の角度に回す
  function drawBody(g, b) {
    var sp = SPRITES[String(b.tier)];
    if (!sp || !sp.img.complete || !sp.img.naturalWidth) return;
    var w = sp.img.naturalWidth, h = sp.img.naturalHeight, k = D.kOf(b.tier) * b.scale;
    g.save();
    g.translate(b.x, b.y); g.rotate(b.angle);
    g.imageSmoothingEnabled = false;
    g.drawImage(sp.img, -w * k / 2, -h * k / 2, w * k, h * k);
    g.restore();
  }

  function render() {
    var g = ctx;
    g.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    g.clearRect(0, 0, C.W, C.H);
    // 線から下が箱（暖色の暗い板で背景を沈め、器を浮かせる。線より上は塗らず差をつける）。箱の縁は左右と底
    g.fillStyle = 'rgba(28,18,10,0.6)'; g.fillRect(0, C.LINE_Y, C.W, C.H - C.LINE_Y);
    g.strokeStyle = 'rgba(255,240,215,0.75)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(1, C.LINE_Y); g.lineTo(1, C.H - 1); g.lineTo(C.W - 1, C.H - 1); g.lineTo(C.W - 1, C.LINE_Y); g.stroke();
    // 上の線
    var danger = state.overTimer > 0;
    g.save();
    g.setLineDash([6, 5]); g.lineWidth = danger ? 2.5 : 1.5;
    g.strokeStyle = danger ? 'rgba(192,57,43,' + (0.5 + 0.5 * Math.abs(Math.sin(state.t * 10))) + ')' : 'rgba(255,240,215,0.7)';
    g.beginPath(); g.moveTo(0, C.LINE_Y); g.lineTo(C.W, C.LINE_Y); g.stroke();
    g.restore();
    // 狙い（落とせるときだけ）
    if (!state.over && D.canDrop(state)) {
      var x = D.clampX(state.current, aimX), r = D.radiusOf(state.current);
      g.strokeStyle = 'rgba(120,100,80,0.25)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, C.DROP_Y + r); g.lineTo(x, C.H); g.stroke();
      drawPiece(g, state.current, x, C.DROP_Y, r, 0.9);
    }
    var bs = state.bodies;
    for (var i = 0; i < bs.length; i++) {
      var b = bs[i];
      drawBody(g, b);
    }
  }

  function renderNext() {
    var g = nctx, W = nextCv.width;
    g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, W);
    // 予告欄は種類が分かればよいので、どの器も欄いっぱいの同じ大きさで描く
    drawPiece(g, state.next, W / 2, W / 2, W * 0.46, 1);
  }

  function toWorld(ev) {
    var rc = cv.getBoundingClientRect();
    return (ev.clientX - rc.left) / scale;
  }
  var pressing = false;
  cv.addEventListener('pointerdown', function (e) {
    if (state.over) return;
    pressing = true; aimX = toWorld(e);
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', function (e) { if (!state.over) aimX = toWorld(e); });
  function release(e) {
    if (!pressing) return; pressing = false;
    aimX = toWorld(e);
    D.drop(state, aimX);
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', function () { pressing = false; });
  document.getElementById('again').addEventListener('click', start);
  document.getElementById('toTop').addEventListener('click', showTop);
  document.getElementById('tGo').addEventListener('click', function () {
    document.body.classList.remove('top'); mode = 'play'; start(); fit();
  });
  document.getElementById('tHowBtn').addEventListener('click', function () { document.body.classList.add('how'); document.getElementById('how').scrollTop = 0; });
  document.getElementById('hBack').addEventListener('click', function () { document.body.classList.remove('how'); });
  window.addEventListener('resize', fit);

  var last = 0, lastNext = -1;
  function loop(now) {
    if (mode === 'top') { last = 0; requestAnimationFrame(loop); return; }
    var dt = last ? (now - last) / 1000 : 0; last = now;
    D.step(state, dt);
    if (state.score !== shownScore) { shownScore = state.score; elScore.textContent = fmt(state.score); }
    var nk = state.drops * 100 + (state.next + 2);
    if (nk !== lastNext) { lastNext = nk; renderNext(); }
    render();
    if (window.SakeSound) window.SakeSound.frame(state);
    if (state.over && !ended) {
      ended = true;
      var r = record(state.score); freshRank = r;
      showBest();
      document.getElementById('oScore').textContent = fmt(state.score);
      document.getElementById('oRank').textContent = r === 0 ? 'いちばん！' : r > 0 ? 'ベスト5の' + (r + 1) + '位' : '';
      document.getElementById('oRank').style.display = r >= 0 ? '' : 'none';
      document.getElementById('oBestRow').style.display = r === 0 ? 'none' : '';
      document.getElementById('oBest').textContent = fmt(best);
      over.classList.add('on');
    }
    requestAnimationFrame(loop);
  }

  start(); fit(); showTop();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
