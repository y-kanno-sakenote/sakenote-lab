<style>
:root {
  color-scheme: light dark;
  --paper: #F3F1EB; --paper2: #E9E6DE; --ink: #22201C; --ink2: #5C574F; --line: #CFC9BC; --sel: #1E5A8C;
  --tile: #DAD6CC; --hit: #A9BCCB; --mark: #D6E1EA; --tag: #8a5a1c; --tag-bg: #f1e3cc;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #1D1B18; --paper2: #26231F; --ink: #EDE8DD; --ink2: #A8A196; --line: #3E3A33; --sel: #6FB1E8;
    --tile: #3A3731; --hit: #4A6378; --mark: #2F4255; --tag: #e2b878; --tag-bg: #3a2f20;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: "Zen Kaku Gothic New", -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", sans-serif;
  font-size: 15px; line-height: 1.7;
}
a { color: var(--sel); }
.wrap { max-width: 1120px; margin: 0 auto; }
header {
  position: sticky; top: 0; z-index: 10; background: var(--paper);
  border-bottom: 1px solid var(--line); padding: 10px 16px 8px;
}
h1 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 700; font-size: 1.35rem; letter-spacing: .03em; margin: 0; line-height: 1.35; }
.meta { font-size: .78rem; color: var(--ink2); margin: 1px 0 8px; }
.ctrl { display: flex; gap: 8px; align-items: center; max-width: 560px; }
.search {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 7px 12px; border: 1px solid var(--line);
  border-radius: 10px; background: var(--paper2); color: var(--ink);
}
.tabs { display: flex; gap: 4px; flex: none; }
.tab {
  font: inherit; font-size: .88rem; font-weight: 700; padding: 5px 12px; border: 1px solid var(--line);
  border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.tab:focus-visible, .nav button:focus-visible, .lit button:focus-visible, .pf:focus-visible, .to:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.nav { display: flex; gap: 3px; margin-top: 8px; max-width: 720px; }
.nav:empty { display: none; }
.nav button {
  flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 2px 0; border: 1px solid var(--line);
  border-radius: 6px; background: transparent; color: var(--ink); cursor: pointer;
}
.nav button:disabled { opacity: .35; cursor: default; }
/* 品目の県だけ光らせているときの帯（解除ボタンつき） */
.lit { display: flex; align-items: center; gap: 10px; margin-top: 8px; max-width: 560px; font-size: .88rem; }
.lit:empty { display: none; }
.lit button {
  flex: none; margin-left: auto; font: inherit; font-size: .85rem; font-weight: 700; min-height: 32px; padding: 3px 14px;
  border: 1px solid var(--line); border-radius: 999px; background: transparent; color: var(--ink); cursor: pointer;
}
main { padding: 12px 16px 32px; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
.layout[hidden], #list[hidden] { display: none; }
#map { display: block; width: 100%; height: auto; max-width: 860px; }
.tile { fill: var(--tile); stroke: var(--paper); stroke-width: 1.5; stroke-linejoin: round; cursor: pointer; }
.searching .tile.hit { fill: var(--hit); }
#map g.off { opacity: .35; pointer-events: none; }
.tile.sel, .tile:focus-visible { stroke: var(--sel); stroke-width: 3; }
.tile:focus { outline: none; }
.lbl { font-size: var(--lf, 12px); fill: var(--ink); pointer-events: none; }
.panel {
  background: var(--paper2); border-radius: 10px; padding: 14px 16px;
  position: sticky; top: calc(var(--hh, 0px) + 12px); max-height: calc(100vh - var(--hh, 0px) - var(--fh, 0px) - 24px); overflow-y: auto;
}
.panel h2 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 22px; margin: 0 0 2px; line-height: 1.4; }
.hint { color: var(--ink2); margin: 0; }
@media (max-width: 800px) {
  header { padding: 8px 12px 8px; }
  main { padding: 10px 12px 28px; }
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .panel { position: static; max-height: none; }
}
#list { max-width: 720px; margin: 0 auto; }
#list h2 { font-family: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif; font-size: 1rem; margin: 18px 0 0; color: var(--ink2); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.count { font-size: .8rem; color: var(--ink2); margin: 0 0 4px; }
.item { padding: 10px 0; border-top: 1px solid var(--line); }
.panel h2 + .item, #list h2 + .item { border-top: 0; }
/* 行き来した先の品目に細い縦線（どこに着いたか分かるように） */
.item.here { box-shadow: inset 3px 0 0 var(--sel); padding-left: 10px; }
.name { font-weight: 700; font-size: 1.02rem; line-height: 1.5; }
.to {
  font: inherit; padding: 0; margin: 0; border: 0; background: none; color: inherit; cursor: pointer; text-align: left;
  text-decoration: underline; text-decoration-color: var(--ink2); text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.tag { display: inline-block; font-size: .7rem; font-weight: 700; color: var(--tag); background: var(--tag-bg); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; line-height: 1.6; }
.desc { margin: 3px 0 4px; font-size: .93rem; }
.pfs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 2px; margin: 0 0 4px; font-size: .85rem; }
.pfs span { color: var(--ink2); font-size: .78rem; margin-right: 4px; }
.pf {
  font: inherit; padding: 4px 6px; margin: 0; border: 0; background: none; color: var(--sel); cursor: pointer;
  text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px;
}
.urls { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: .8rem; }
.urls a { overflow-wrap: anywhere; }
.empty { color: var(--ink2); text-align: center; padding: 32px 0; }
footer { font-size: .75rem; color: var(--ink2); padding: 0 16px 32px; }
footer p { margin: 4px 0; }
mark { background: var(--mark); color: inherit; border-radius: 2px; }
</style>
</head>

<script>
const DATA = {"title":"醸造百選リスト","date":"2026-10-06","publisher":"日本醸造学会","source_url":"https://www.jozo.or.jp/gakkai/wp-content/uploads/sites/4/f83048b418626097dd4be52ef32d9810.pdf","notes":{"aiueo":"太字で記載したものは、複数地域で生産されているもの。","pref":["複数地域で生産されているものは、例として代表的な産地や特徴のある産地の都道府県に太字で記載した。","焼酎は本格焼酎・泡盛を指し、連続式蒸留焼酎は含まない。","酒類で地理的表示（GI）に指定されている場合はその旨を記載した。"]},"items":[{"name":"藍","description":"アイ（藍）の葉を細かく刻み、乾燥させ、発酵させて作られるのが藍染めの原料のすくも。徳島県の阿波地方が伝統的なすくもの主産地。","urls":["https://www.pref.tokushima.lg.jp/tafftsc/material/kyunougyou/7216556/"],"bold":false,"page":1,"pdf_no":1,"gyo":"あ","prefs":["徳島"]},{"name":"あけがらし","description":"米麴、ケシ、麻の実、生絞り醤油、三温糖を原料に、山形県の１社のみで作られている模様。ごはんや豆腐に乗せて食べる。","urls":["https://akegarashi.jp/framepage1.htm"],"bold":false,"page":1,"pdf_no":3,"gyo":"あ","prefs":["山形"]},{"name":"甘酒","description":"酒粕を用いるものと、麴で糖化させるものがある。麴甘酒は江戸時代から夏の風物とされ、酒粕甘酒は大正時代の終わり頃に作られるようになったと言われる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/bunrui/inryou.html"],"bold":true,"page":1,"pdf_no":4,"gyo":"あ","prefs":["青森","新潟","山口"]},{"name":"鮎醤油","description":"大分県で造られるアユの魚醤で、匂いの癖がないことが特徴。","urls":["https://shokunotasuki.jp/feature/maruhara/"],"bold":false,"page":1,"pdf_no":5,"gyo":"あ","prefs":["大分"]},{"name":"鮎なれずし","description":"塩漬けしたアユの腹に、炊き立てのご飯を詰め、2ヵ月ほど樽に漬け込み乳酸発酵させたなれずし。岐阜の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_7_gifu.html"],"bold":false,"page":1,"pdf_no":6,"gyo":"あ","prefs":["岐阜"]},{"name":"阿波晩茶","description":"徳島県の山間部で作られる、茶葉をゆでた後、乳酸発酵させ、乾燥させた独特の風味のお茶。","urls":["https://www.kamikatsuawabanchakyokai.com/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":1,"pdf_no":7,"gyo":"あ","prefs":["徳島"]},{"name":"いかなご醤油","description":"香川県で1955年頃まで家庭でも作られていた、イカナゴを原料にした魚醤。その後途絶えたが、関係者の努力によって復活された。","urls":["https://www.jstage.jst.go.jp/article/jbrewsocjapan1988/88/2/88_2_135/_pdf/-char/en"],"bold":false,"page":1,"pdf_no":8,"gyo":"あ","prefs":["香川"]},{"name":"石鎚黒茶","description":"愛媛県西条市で作られる、蒸した茶葉を糸状菌による好気発酵の後、乳酸菌による嫌気発酵の二段階で発酵させ、天日乾燥させた後発酵茶。","urls":["https://ishizuchikurocha.com/about/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":1,"pdf_no":9,"gyo":"あ","prefs":["愛媛"]},{"name":"いしる・いしり","description":"石川県能登地方に伝わる、イカの内臓、サバの骨や内臓、イワシを原料とする魚醤。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/isiri_isiru.html"],"bold":false,"page":1,"pdf_no":10,"gyo":"あ","prefs":["石川"]},{"name":"飯寿司（いずし）","description":"ホッケなどの魚と野菜を米麴に漬けて、低温で乳酸発酵させたすし。北海道の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/izushi_hokkaido.html"],"bold":false,"page":1,"pdf_no":11,"gyo":"あ","prefs":["北海道"]},{"name":"いぶりがっこ","description":"天日干しが難しい地域で、囲炉裏で干した大根を用いた、秋田県のたくあん漬け。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/29_1_akita.html"],"bold":false,"page":1,"pdf_no":12,"gyo":"あ","prefs":["秋田"]},{"name":"ウイスキー","description":"日本のウイスキー造りは大正12年（1923年）に本格的な蒸留所の建設が着工したことに始まる。現在ではジャパニーズウイスキーと呼ばれ、小規模醸造所の開設も相次いでいる。","urls":["https://jwic.jp/history/"],"bold":true,"page":1,"pdf_no":13,"gyo":"あ","prefs":["北海道","大阪"]},{"name":"おなっとう","description":"長野県佐久地方で作られる、米飯に麴を混ぜて作る甘い郷土料理。","urls":["https://www.youtube.com/watch?v=aVRlVf2s_Is"],"bold":false,"page":1,"pdf_no":14,"gyo":"あ","prefs":["長野"]},{"name":"オントゥレプ","description":"オオウバユリの球根からデンプンを採った後の繊維質を発酵させ、乾燥させたアイヌの伝統的な保存食。","urls":["https://nobitokisu.com/fermentationtraveler/introduce/%E3%82%AA%E3%83%B3%E3%83%88%E3%82%A5%E3%83%AC%E3%83%97/"],"bold":false,"page":1,"pdf_no":15,"gyo":"あ","prefs":["北海道"]},{"name":"柿渋","description":"青い未熟な渋柿をしぼり、発酵後２～５年熟成させたもの、防虫効果、防腐効果、防水効果を示し、日本酒の滓下げにも用いられる。岐阜県、京都府が主な産地。","urls":["https://www.jstage.jst.go.jp/article/kakyoshi/64/7/64_348/_pdf/-char/ja"],"bold":true,"page":1,"pdf_no":16,"gyo":"か","prefs":["岐阜","京都"]},{"name":"鰹節","description":"ゆでたカツオの身を燻して乾燥させ（荒節）、さらにカビ付け、天日干しを繰り返したものが枯節。鹿児島県、静岡県、三重県等が産地として知られ、それぞれ製法に特徴がある。","urls":["https://www.katsuobushi-kyo.or.jp/","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nakiribusi.html","https://www.city.makurazaki.lg.jp/soshiki/suisan/5320.html"],"bold":true,"page":1,"pdf_no":17,"gyo":"か","prefs":["静岡","三重","鹿児島"]},{"name":"かぶらずし","description":"塩漬けしたカブに塩漬けしたブリなどの魚を挟み、米麴で発酵させたなれずし。石川県の伝統的な郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kaburazushi_ishikawa.html"],"bold":false,"page":2,"pdf_no":18,"gyo":"か","prefs":["石川"]},{"name":"かんずり","description":"新潟県上越地方で作られる、雪にさらした唐辛子に米麴とユズ、塩を混ぜて３年間熟成・発酵させた調味料。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kanzuri_niigata.html"],"bold":false,"page":2,"pdf_no":19,"gyo":"か","prefs":["新潟"]},{"name":"京漬物","description":"京都では、洛外で栽培された各種の野菜を塩蔵保存したことに始まり、漬物文化が発展した。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kyo_tukemono.html"],"bold":false,"page":2,"pdf_no":20,"gyo":"か","prefs":["京都"]},{"name":"くさや","description":"魚を特有のにおいがする「くさや液」と呼ばれる発酵液に浸けて作られる、東京都伊豆諸島の干物。","urls":["https://oshima-navi.com/gourmet/kusaya01.html"],"bold":false,"page":2,"pdf_no":21,"gyo":"か","prefs":["東京"]},{"name":"久寿餅","description":"１年以上発酵させた小麦デンプンを蒸して作る和菓子。関東地方で作られ、神奈川県の川崎大師の門前町が有名。","urls":["https://www.alic.go.jp/joho-s/joho07_002929.html"],"bold":false,"page":2,"pdf_no":22,"gyo":"か","prefs":["神奈川"]},{"name":"碁石茶","description":"高知県大豊町に伝わる、収穫した茶葉を蒸した後にカビ付けし、次に漬物と同じ要領で重石をのせて漬け込む「二段階発酵」させる後発酵茶。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/goisitya.html","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":2,"pdf_no":23,"gyo":"か","prefs":["高知"]},{"name":"紅葉漬け","description":"福島県阿武隈川流域で作られる、細かく刻んだサケを麴と塩で漬け込み、発酵させた保存食。","urls":["https://www.do-fukushima.or.jp/fukushimabimi/iwaki2018/abukumanokouyouduke/"],"bold":false,"page":2,"pdf_no":24,"gyo":"か","prefs":["福島"]},{"name":"ごさい漬け","description":"茨城県で以前はイワシ、現在はサンマのぶつ切りを塩漬けにし、発酵してきたら大根、赤唐辛子、ユズと一緒に漬け込んだもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/gosaizuke_ibaraki.html"],"bold":false,"page":2,"pdf_no":25,"gyo":"か","prefs":["茨城"]},{"name":"ごど","description":"青森県南部から岩手県に伝わる大豆を利用した発酵食品。地域や家庭によって用いる原料や麴、製法が異なり、岩手県では「ごど豆」と呼ばれるものもある。","urls":["https://aomori-tourism.com/blog/2024/11/27824.html","https://hirakuogura.com/p-12001/","https://iwate-u.repo.nii.ac.jp/records/11555/file_details/erar-v55n1p119-130.pdf?filename=erar-v55n1p119-130.pdf&file_order=0","https://www.jstage.jst.go.jp/article/msj7abst/69/0/69_91_2/_pdf/-char/ja"],"bold":true,"page":2,"pdf_no":26,"gyo":"か","prefs":["青森","岩手"]},{"name":"こんかいわし","description":"石川県で作られる、イワシを塩漬けし、さらにぬかに漬けて乳酸発酵を促したもの。「こんか」とは米ぬかのこと。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/konka_iwasi.html"],"bold":false,"page":2,"pdf_no":27,"gyo":"か","prefs":["石川"]},{"name":"鮭の飯ずし","description":"青森県でサケを麴ともち米を合わせたものに漬け込み、涼しい場所で乳酸発酵させた飯ずし。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sakeno_iizushi_aomori.html"],"bold":false,"page":2,"pdf_no":28,"gyo":"さ","prefs":["青森"]},{"name":"三五八漬け","description":"塩が三、麴が五、米飯が八と言われる漬け床に野菜を漬ける漬物。福島県など、東北地方各地で作られている。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/30_14_fukushima.html"],"bold":false,"page":2,"pdf_no":29,"gyo":"さ","prefs":["福島"]},{"name":"薩摩地酒","description":"清酒とほぼ同じ製法の途中で灰を加えて造る灰持酒（あくもちざけ）の一種で、鹿児島県で郷土料理の味付けに使われることが多い。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akumotizake.html"],"bold":false,"page":2,"pdf_no":30,"gyo":"さ","prefs":["鹿児島"]},{"name":"鯖の塩辛","description":"島根県松江市美保関町で作られる、新鮮なマサバの頭を落とし、内臓ごと輪切りにし、長年継ぎ足してきた塩辛のたれに漬け込んだもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/sabano_siokara.html"],"bold":false,"page":2,"pdf_no":31,"gyo":"さ","prefs":["島根"]},{"name":"シードル","description":"リンゴを原料にした醸造酒のシードルは、低アルコール分で発泡性のものが多い。リンゴの主産地、青森県や長野県には小規模なシードル生産者も多い。","urls":["https://www.city.hirosaki.aomori.jp/sangyo/nogyo/apple/cider.html","https://www.go-nagano.net/food-and-drink/id19460"],"bold":true,"page":2,"pdf_no":32,"gyo":"さ","prefs":["青森","長野"]},{"name":"塩納豆","description":"山形県庄内地方で作られる、塩漬けにした納豆と麴、昆布を混ぜた食品。","urls":["https://blog.exeamarume.co.jp/sakatanatto/","https://shonai-kuko.com/s_i090/"],"bold":false,"page":2,"pdf_no":33,"gyo":"さ","prefs":["山形"]},{"name":"塩麴","description":"江戸時代の塩麴漬けをヒントに、米麴、塩、水を混ぜて熟成させた、大分県の老舗糀屋で平成19年に生まれた新しい発酵調味料。塩味に甘味・コクが加わり、麴菌由来酵素作用によってうま味が増す。全国各地で生産され、輸出もされている。","urls":["https://www.jstage.jst.go.jp/article/swsj/71/4/71_232/_pdf/-char/ja"],"bold":true,"page":2,"pdf_no":34,"gyo":"さ","prefs":["新潟","大分"]},{"name":"地伝酒","description":"島根県で戦前まで作られていた灰持酒（あくもちざけ）の一種が平成２年に復活された。アゴ野焼きなどの出雲料理に使われる。","urls":["https://www.toyonoaki.com/jidenshu/revival-story/"],"bold":false,"page":2,"pdf_no":35,"gyo":"さ","prefs":["島根"]},{"name":"しな漬","description":"岐阜県飛騨地方の特産品・赤カブのほか、キュウリ、大根、キノコなどを塩漬けにしたもの。","urls":["https://gifu.mytabi.net/hida-shinazuke.php"],"bold":false,"page":2,"pdf_no":36,"gyo":"さ","prefs":["岐阜"]},{"name":"しゃくし菜漬け","description":"埼玉県秩父地方の伝統野菜、しゃくし菜を塩漬けにし、乳酸発酵させた漬物。","urls":["https://kyoudo-ryouri.com/food/1518.html"],"bold":false,"page":3,"pdf_no":37,"gyo":"さ","prefs":["埼玉"]},{"name":"酒盗","description":"カツオの胃や腸などを塩に漬け込んで発酵、熟成させた高知県の珍味。塩辛は魚介類の内臓と身を使うが、酒盗は内臓のみを用いて熟成期間も長い点が特徴。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/syutou.html"],"bold":false,"page":3,"pdf_no":38,"gyo":"さ","prefs":["高知"]},{"name":"浄法寺漆","description":"漆はウルシの木の樹液成分が酵素酸化して重合・固化したもの。樹液の採取後、微生物による発酵（漆が沸く、と呼ばれる）が収まってから出荷される。岩手県二戸市は国産漆の主産地。","urls":["https://jobojiurushi-seisankumiai.com/","https://www.ffpri.go.jp/pubs/kikan/documents/kikanffpri-48.pdf"],"bold":false,"page":3,"pdf_no":39,"gyo":"さ","prefs":["岩手"]},{"name":"醤油","description":"古くから日本各地で生産されてきた醤油は、それぞれの地域の嗜好や醸造の歴史などにより、さまざまな個性を持っている。都道府県別リストには特徴や歴史のある産地を例として記載した。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/bunrui/shouyu-miso.html","https://www.soysauce.or.jp/"],"bold":true,"page":3,"pdf_no":40,"gyo":"さ","prefs":["茨城","埼玉","千葉","石川","愛知","京都","兵庫","奈良","和歌山","島根","山口","香川"]},{"name":"しょっつる","description":"ハタハタを塩漬けにし1年以上魚が溶けるまで熟成させたものをこして、うまみ成分を取り出した秋田県の伝統的な魚醤。塩魚汁（しょっつる）。","urls":["https://oganavi.com/food/9/"],"bold":false,"page":3,"pdf_no":41,"gyo":"さ","prefs":["秋田"]},{"name":"酢","description":"酒と同じぐらい長い歴史を持つ調味料。日本では米酢が多いが、江戸時代に酒粕から作られる粕酢が開発されて広まった。沖縄のもろみ酢は酢酸ではなくクエン酸を含むが、都道府県別リストでは酢に含めて記載した。","urls":["http://www.shokusu.org/ebook/index.html?pNo=1"],"bold":true,"page":3,"pdf_no":42,"gyo":"さ","prefs":["愛知","鹿児島","沖縄"]},{"name":"すしこ","description":"蒸したもち米と赤シソやキャベツ、キュウリの古漬けなどと合わせて乳酸発酵させた青森県の「ごはんの漬物」。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sushiko_aomori.html"],"bold":false,"page":3,"pdf_no":43,"gyo":"さ","prefs":["青森"]},{"name":"スルメの麴漬け","description":"スルメイカを海風に1日干した後、刻み、野菜の塩漬けと一緒に麴に漬け込んだ鳥取県の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/surume_no_kouji_zuke_tottori.html"],"bold":false,"page":3,"pdf_no":44,"gyo":"さ","prefs":["鳥取"]},{"name":"すんき","description":"長野県で作られる、赤カブの葉を、塩を使わず「すんき種」を加えて乳酸発酵させた無塩の漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sunki_zuke_nagano.html"],"bold":false,"page":3,"pdf_no":45,"gyo":"さ","prefs":["長野"]},{"name":"せんだんご","description":"サツマイモを切って水にさらした後、発酵させ、団子状にしてカビを生やし、再度水にさらしてデンプンを得て乾燥させた食材。長崎県対馬地方で千の工程と言われるほど手間をかけて作られる。","urls":["https://tsushima-kanko.net/info/997"],"bold":false,"page":3,"pdf_no":46,"gyo":"さ","prefs":["長崎"]},{"name":"僧坊酒","description":"室町時代に寺院で造られていた日本酒の原型で、奈良県と大阪府で復活させる取組が行われている。","urls":["https://nihonshu-tourism.com/archives/3842","https://shoryakuji.jp/sake-birthplace.html"],"bold":true,"page":3,"pdf_no":47,"gyo":"さ","prefs":["大阪","奈良"]},{"name":"高菜漬け","description":"九州各地で作られる、高菜を塩漬けにし、乳酸発酵させた漬物。福岡県と熊本県が有名。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/takana_zuke.html","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/aso_takana_zuke_kumamoto.html"],"bold":true,"page":3,"pdf_no":48,"gyo":"た","prefs":["福岡","熊本"]},{"name":"だんだん納豆","description":"米麴、大豆、ニンジン、昆布、ショウガを自然の納豆菌で発酵させた宮崎県椎葉村の伝統食。","urls":["https://ameblo.jp/m-tokusan/entry-10355409692.html"],"bold":false,"page":3,"pdf_no":49,"gyo":"た","prefs":["宮崎"]},{"name":"チーズ","description":"日本のチーズは北海道が生産量、工房数とも１位。現在では全国各地で風土に合わせたナチュラルチーズが造られている。","urls":["https://www.milkland-hokkaido.com/koubou/history.html","https://www.alic.go.jp/joho-c/joho05_002074.html","https://www.maff.go.jp/j/pr/aff/2206/spe1_03.html"],"bold":false,"page":3,"pdf_no":50,"gyo":"た","prefs":["北海道"]},{"name":"秩父おなめ","description":"埼玉県秩父地方で作られる、大豆と大麦で作った麴に塩水を加えて発酵させた諸味味噌のような保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/33_25_saitama.html"],"bold":false,"page":3,"pdf_no":51,"gyo":"た","prefs":["埼玉"]},{"name":"寺納豆","description":"蒸煮し、はったい粉（炒った大麦または小麦の粉）をまぶした大豆で麴を作り、塩水に浸けて熟成させた後乾燥させた保存食。京都の大徳寺などで作られる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tera_natto.html"],"bold":false,"page":3,"pdf_no":52,"gyo":"た","prefs":["京都"]},{"name":"豆造(とうぞ)","description":"千葉県で作られる、大豆の煮汁に塩、米麴、納豆、水戻しした切り干し大根を加えて発酵させた食品。","urls":["https://ja.wikipedia.org/wiki/%E3%81%A8%E3%81%86%E3%81%9E"],"bold":false,"page":3,"pdf_no":53,"gyo":"た","prefs":["千葉"]},{"name":"豆腐よう","description":"陰干しした豆腐を紅麴と泡盛を含む漬け汁に漬け、発酵・熟成させた沖縄の特産品。","urls":["https://www.jstage.jst.go.jp/article/myco/63/1/63_67/_pdf/-char/ja"],"bold":false,"page":3,"pdf_no":54,"gyo":"た","prefs":["沖縄"]},{"name":"土佐漆喰","description":"高知県で使われる、のりの代わりに発酵させた稲わらを消石灰に混ぜて作る漆喰で、耐水性が高い。","urls":["https://www.pref.kochi.lg.jp/doc/2026012600142/"],"bold":false,"page":3,"pdf_no":55,"gyo":"た","prefs":["高知"]},{"name":"どぶろく","description":"日本酒のように米、米麴、水を原料として発酵させるが、濾さずに濁った状態の酒。伝統的に神社の祭礼で用いられてきたほか、地域おこしを目的とした、いわゆる「どぶろく特区」でも作られており、都道府県別リストではそれぞれ代表例を記載した。","urls":["https://nakanotokanko.com/whats-doburoku/blog/doburoku/"],"bold":true,"page":4,"pdf_no":56,"gyo":"た","prefs":["岩手","岐阜","大分"]},{"name":"納豆","description":"ゆでた大豆に納豆菌を生やした糸引納豆。以前は主に東日本で生産・消費されていたが、現在では全国に広がっている。都道府県別リストでは代表的産地に記載した。","urls":["https://www.natto.or.jp/index.php"],"bold":true,"page":4,"pdf_no":57,"gyo":"な","prefs":["岩手","宮城","茨城"]},{"name":"納豆味噌","description":"長崎県南島原で作られる、もろみ味噌に裸麦、昆布、生姜をまぜ、水飴等で味付けした食品。納豆は含まれていない。","urls":["https://oishii-minamishimabara.jp/certified_product/no120/","https://hakkou-kiyoya.com/product/%e5%b3%b6%e5%8e%9f%e7%b4%8d%e8%b1%86%e3%81%bf%e3%81%9d-300g/"],"bold":false,"page":4,"pdf_no":58,"gyo":"な","prefs":["長崎"]},{"name":"なめぜ","description":"新潟県で作られる、大豆と麦で麴を作り、さらに米麴、塩、水を加えて発酵させた食品。お酒やご飯のお供。","urls":["https://howtoniigata.jp/feature/special-6/32186/"],"bold":false,"page":4,"pdf_no":59,"gyo":"な","prefs":["新潟"]},{"name":"奈良漬け","description":"ウリなどの野菜を塩漬けした後、酒粕に何度も漬け替えて作られる奈良県の特産品。最近、乳酸菌が働いていることが報告された。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/naraduke.html"],"bold":false,"page":4,"pdf_no":60,"gyo":"な","prefs":["奈良"]},{"name":"ナリ味噌（蘇鉄味噌）","description":"奄美大島や徳之島で作られる、ソテツの実「ナリ」を砕いて水にさらし、米と混ぜて蒸して麴にしたナリ麴で仕込んだ味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/narimiso.html"],"bold":false,"page":4,"pdf_no":61,"gyo":"な","prefs":["鹿児島"]},{"name":"なれずし","description":"塩漬けしたサバ、サンマを米飯に乗せ、葉できっちり巻いて乳酸発酵させる和歌山県の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nare_zushi_wakayama.html"],"bold":false,"page":4,"pdf_no":62,"gyo":"な","prefs":["和歌山"]},{"name":"にしんすし","description":"身欠きニシンを水に戻し、大根、ニンジンなどと麴に漬けた、福井県の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nishin_sushi_fukui.html"],"bold":false,"page":4,"pdf_no":63,"gyo":"な","prefs":["福井"]},{"name":"日光たまり漬け","description":"野菜を塩漬けした後に塩抜きし、たまりを使った調味液に漬け込んだ、栃木県日光の名物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tamari_zuke.html"],"bold":false,"page":4,"pdf_no":64,"gyo":"な","prefs":["栃木"]},{"name":"日本酒","description":"古くから日本各地で生産されてきた日本酒は、地域によって原料や気候、地域の嗜好によって特徴が異なる。都道府県別リストでは地理的表示（GI）に指定されている地域と、歴史や原料等に特徴のある産地を例として記載した。","urls":["https://japansake.or.jp/sake/"],"bold":true,"page":4,"pdf_no":65,"gyo":"な","prefs":["青森","岩手","宮城","秋田","山形","福島","群馬","新潟","石川","山梨","長野","静岡","愛知","三重","滋賀","京都","兵庫","鳥取","岡山","広島","山口","高知","福岡","佐賀"]},{"name":"ぬかにしん","description":"北海道で作られる、ニシンのぬか漬け。江戸時代、たくさん獲れるニシンの保存法として考案されたと言われる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nukanisin.html"],"bold":false,"page":4,"pdf_no":66,"gyo":"な","prefs":["北海道"]},{"name":"ねずし","description":"小さく切った塩マスと塩もみした大根やニンジンを、麴を混ぜた米飯に2週間から20日ほど漬け込んだ岐阜県飛騨・中濃地方の正月料理。「寝酢」とも書かれ、文字通り寝かせて作るなれずしの一種。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_12_gifu.html"],"bold":false,"page":4,"pdf_no":67,"gyo":"な","prefs":["岐阜"]},{"name":"野沢菜漬け","description":"長野県の特産、野沢菜を塩漬けし、乳酸発酵させたもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nozawana_zuke_nagano.html"],"bold":false,"page":4,"pdf_no":68,"gyo":"な","prefs":["長野"]},{"name":"博多練酒","description":"米ともち米を乳酸発酵させ、米麴と蒸米、水を入れてアルコール発酵させたもろみを臼ですって作られる、室町時代の製法を復刻させた酒。","urls":["https://www.jstage.jst.go.jp/article/jbrewsocjapan1915/71/4/71_4_242/_pdf/-char/ja"],"bold":false,"page":4,"pdf_no":69,"gyo":"は","prefs":["福岡"]},{"name":"ハタハタ寿し","description":"ハタハタを用いた秋田の飯寿司。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/29_2_akita.html"],"bold":false,"page":4,"pdf_no":70,"gyo":"は","prefs":["秋田"]},{"name":"バタバタ茶（富山黒茶）","description":"富山県朝日町で作られる、茶葉を蒸した後、60℃の高温で糸状菌などによって好気的に発酵させた茶。茶筅でバタバタと泡立てて飲む。","urls":["https://www.asahi-tabi.com/sanpo/2023/11/21/2312/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":4,"pdf_no":71,"gyo":"は","prefs":["富山"]},{"name":"浜納豆","description":"大豆麴に塩水を加え、樽で１年以上発酵・熟成させたもの。寺納豆が浜名湖周辺や愛知県豊橋市に伝わり、徳川家康が浜名の納豆を好んだと言われる。","urls":["https://www.city.hamamatsu.shizuoka.jp/foodpark/hamamatsu-foods/hamanatto.html","https://www.youtube.com/watch?v=qFI4Bpfdsms"],"bold":false,"page":4,"pdf_no":72,"gyo":"は","prefs":["静岡"]},{"name":"はまなみそ","description":"米麴の甘酒に豆麴や醤油、塩漬けナスや、シソの実、ショウガなどを加え、20日ほど熟成させる福井の冬の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/hamana_miso_fukui.html"],"bold":false,"page":5,"pdf_no":73,"gyo":"は","prefs":["福井"]},{"name":"ビール","description":"日本のビール造りは、明治３年（1870年）に横浜にアメリカ人コープランドが醸造所を創設したことが始まりとされる。日本ではラガータイプのビールが主流であったが、近年はクラフトビールを中心に、様々なタイプのビールも造られている。","urls":["https://www.brewers.or.jp/tips/histry.html"],"bold":true,"page":5,"pdf_no":74,"gyo":"は","prefs":["北海道","神奈川"]},{"name":"肥後の赤酒","description":"清酒とほぼ同じ製法の途中で灰を加えて造る灰持酒（あくもちざけ）の一つ。アルカリ性の条件で糖分とアミノ酸が反応し、赤色を示す。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akazake.html"],"bold":false,"page":5,"pdf_no":75,"gyo":"は","prefs":["熊本"]},{"name":"ひねずし","description":"塩漬けした魚を米と漬け、発酵させた石川県能登地方の保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hinezusi.html"],"bold":false,"page":5,"pdf_no":76,"gyo":"は","prefs":["石川"]},{"name":"広島菜漬","description":"広島菜を二度塩漬けにしたのち、麴などと一緒に本漬けにし、乳酸発酵させた広島の特産漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hiroshimana_zuke.html"],"bold":false,"page":5,"pdf_no":77,"gyo":"は","prefs":["広島"]},{"name":"ふぐの子の粕漬け","description":"ゴマフグの卵巣を2年以上塩蔵した後、酒粕に漬けて長期間熟成、解毒させたもの。製造には免許が必要で、新潟では佐渡で作られる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/fuguno_ko_no_kasuzuke_niigata.html"],"bold":false,"page":5,"pdf_no":78,"gyo":"は","prefs":["新潟"]},{"name":"ふぐの子のぬか漬け","description":"フグの卵巣を約半年～1年塩漬けにした後、米麴、ぬか、トウガラシ、いしるとともに重石をして漬けたもので、この間に解毒される。さらに約半年酒粕に漬けたものも作られる。石川県の限られた製造者のみに製造が認められている。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hugunoko_no_nukazuke.html","https://mikawa.shoko.or.jp/fugunoko/"],"bold":false,"page":5,"pdf_no":79,"gyo":"は","prefs":["石川"]},{"name":"鮒ずし","description":"滋賀県、琵琶湖でとれる子持ちのニゴロブナを塩漬けにした後、米飯に漬け、乳酸発酵させた代表的ななれずし。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/funa_zushi_shiga.html"],"bold":false,"page":5,"pdf_no":80,"gyo":"は","prefs":["滋賀"]},{"name":"へしこ","description":"サバなどの魚を塩漬けし、さらにぬか漬けにした福井県の保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/heshiko_fukui.html"],"bold":false,"page":5,"pdf_no":81,"gyo":"は","prefs":["福井"]},{"name":"べったら漬け","description":"塩で下漬けした大根を米麴と砂糖で漬けこんだ東京の特産漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_8_tokyo.html"],"bold":false,"page":5,"pdf_no":82,"gyo":"は","prefs":["東京"]},{"name":"紅花（紅餅）","description":"ベニバナの花弁から水溶性の成分を除いた後、発酵、乾燥させたものが紅餅、紅花染に用いる。山形県の特産品。","urls":["https://www.lib.yamagata-u.ac.jp/database/benibana/mame.html"],"bold":false,"page":1,"pdf_no":2,"gyo":"は","prefs":["山形"]},{"name":"干し味噌","description":"醤油粕にユズの皮やショウガ、ゴマ、コショウなどをすり入れ小さな団子にして干したもの。熊本県で作られ、ご飯にかけて食べる。","urls":["https://kumamoto-museum.net/blog/archives/chiiki/1425"],"bold":false,"page":5,"pdf_no":83,"gyo":"は","prefs":["熊本"]},{"name":"本格焼酎・泡盛","description":"日本の伝統的な蒸留酒で単式蒸留で作られる。地域によって主原料が異なり、それぞれ特徴ある香味を持つ。都道府県別リストでは焼酎の用語を使用しているが連続式蒸留焼酎は含まない。また沖縄の花酒は酒税法上はスピリッツに分類されるが、泡盛と並べて記載した。","urls":["https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/"],"bold":true,"page":5,"pdf_no":84,"gyo":"は","prefs":["東京","福岡","長崎","熊本","鹿児島","沖縄"]},{"name":"松浦漬・玄海漬","description":"鯨基地として栄えた佐賀県唐津地方で、鯨を余すところなく利用するため、軟骨を粕漬けにした珍味。","urls":["https://xn--btr924e.jp/chinmi/mk"],"bold":false,"page":5,"pdf_no":85,"gyo":"ま","prefs":["佐賀"]},{"name":"みき","description":"湯に米粉と砂糖を入れて加熱し、30℃程度に冷めたらすり下ろしたサツマイモの絞り汁を加え、冷暗所で乳酸発酵させた鹿児島県奄美地方の飲み物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/miki_kagoshima.html"],"bold":false,"page":5,"pdf_no":86,"gyo":"ま","prefs":["鹿児島"]},{"name":"味噌","description":"味噌の主原料は大豆で、麴の原料によって米味噌、麦味噌、豆味噌などの種類に加え、白味噌、赤味噌、辛味噌、甘味噌などの違いがあり、地域特性がある。都道府県別リストには特徴的な味噌の産地を例として示した。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/bunrui/shouyu-miso.html"],"bold":true,"page":5,"pdf_no":87,"gyo":"ま","prefs":["宮城","富山","山梨","愛知","京都","奈良","和歌山","香川","愛媛"]},{"name":"みりん","description":"蒸したもち米、米麴、焼酎・アルコールを原料に、糖化・熟成させた酒類調味料。昔は甘い酒として飲まれていたが、江戸時代後期から鰻のタレやそばつゆに使われるようになった。","urls":["https://www.honmirin.org/knowledge/"],"bold":true,"page":5,"pdf_no":88,"gyo":"ま","prefs":["千葉","愛知"]},{"name":"むかでのり","description":"宮崎県日南海岸でとれるキリンサイという海藻を天日干しにし、それを煮出して寒天状にしさらに味噌漬けにしたもの。","urls":["https://hirakuogura.com/p-12177/"],"bold":false,"page":5,"pdf_no":89,"gyo":"ま","prefs":["宮崎"]},{"name":"守口漬","description":"細く、長さが１ｍ以上もある守口大根を塩漬け、酒粕漬けのあと、みりん粕に漬けた愛知県の伝統的な漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/moriguchi_zuke.html"],"bold":false,"page":5,"pdf_no":90,"gyo":"ま","prefs":["愛知"]},{"name":"焼まんじゅう","description":"小麦粉やもち米を麴を使ったどぶろくのような「もと種」で発酵させ、蒸した素まんじゅうを竹串に刺し、味噌だれをつけて焼いた群馬県のソウルフード。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/32_26_gunma.html"],"bold":false,"page":6,"pdf_no":91,"gyo":"や","prefs":["群馬"]},{"name":"山川漬","description":"干し大根を3か月以上、底にすのこを敷いた甕で塩漬けにし、乳酸発酵・熟成させた鹿児島県の伝統的な漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/yamagawazuke.html"],"bold":false,"page":6,"pdf_no":92,"gyo":"や","prefs":["鹿児島"]},{"name":"雪割納豆","description":"ひきわり納豆に塩と米麴を加えて二次発酵させた山形県の伝統食品。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/yukiwari_natto.html"],"bold":false,"page":6,"pdf_no":93,"gyo":"や","prefs":["山形"]},{"name":"るくじゅう","description":"島豆腐を切って塩水にくぐらせ、数日天日干しをしながら発酵させた食材。焼いたり揚げたりして食べる幻の沖縄料理。","urls":["https://www.dee-okinawa.com/topics/2014/01/rukuju.html"],"bold":false,"page":6,"pdf_no":94,"gyo":"ら","prefs":["沖縄"]},{"name":"ワイン","description":"明治初期に殖産興業の一環としてブドウ栽培とワイン造りが奨励されたのが始まり。長い間甘味果実酒が主流であったが、現在では高品質なワインが多くなっている。","urls":["https://www.winery.or.jp/basic/"],"bold":true,"page":6,"pdf_no":95,"gyo":"わ","prefs":["北海道","山形","新潟","山梨","長野","大阪"]},{"name":"わさび漬け","description":"ワサビの刻んだ葉、茎、根を酒粕に漬けた静岡の特産品。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/36_3_shizuoka.html"],"bold":false,"page":6,"pdf_no":96,"gyo":"わ","prefs":["静岡"]}],"pref_entries":[{"region":"北海道・東北","pref":"北海道","name":"オントゥレプ","description":"オオウバユリの球根からデンプンを採った後の繊維質を発酵させ、乾燥させたアイヌの伝統的な保存食。","urls":["https://nobitokisu.com/fermentationtraveler/introduce/%E3%82%AA%E3%83%B3%E3%83%88%E3%82%A5%E3%83%AC%E3%83%97/"],"bold":false,"page":7,"item":"オントゥレプ"},{"region":"北海道・東北","pref":"北海道","name":"飯寿司（いずし）","description":"魚と野菜を米麴に漬けて、低温で乳酸発酵させたすし。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/izushi_hokkaido.html"],"bold":false,"page":7,"item":"飯寿司（いずし）"},{"region":"北海道・東北","pref":"北海道","name":"ぬかにしん","description":"ニシンのぬか漬け。江戸時代、たくさん獲れるニシンの保存法として考案されたと言われる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nukanisin.html"],"bold":false,"page":7,"item":"ぬかにしん"},{"region":"北海道・東北","pref":"北海道","name":"ビール","description":"札幌は開拓使によるビール造り発祥の地。","urls":["https://www.hkd.mlit.go.jp/sp/kasen_keikaku/e9fjd60000000yak.html","https://www.city.sapporo.jp/chuo/gaiyo/history/documents/3-11.pdf"],"bold":true,"page":7,"item":"ビール"},{"region":"北海道・東北","pref":"北海道","name":"ウイスキー","description":"余市では昭和11年（1936年）からウイスキー造りが行われ、伝統的な石炭直火蒸留の技が守られている。","urls":["https://yoichi-kankoukyoukai.com/foodculture/%E3%82%A6%E3%82%A4%E3%82%B9%E3%82%AD%E3%83%BC/","https://jwic.jp/history/"],"bold":true,"page":7,"item":"ウイスキー"},{"region":"北海道・東北","pref":"北海道","name":"ワイン","description":"北海道はぶどう酒の地理的表示（GI）。GI北海道は大地の恵みから醸される豊かな酸味と果実の香りのワイン。","urls":["https://winesofhokkaido.com/"],"bold":true,"page":7,"item":"ワイン"},{"region":"北海道・東北","pref":"北海道","name":"チーズ","description":"明治初期からの長い歴史があり、チーズの生産量、チーズ工房数も日本一。現在では全国各地で風土に合わせたナチュラルチーズが造られている。","urls":["https://www.milkland-hokkaido.com/koubou/history.html","https://www.alic.go.jp/joho-c/joho05_002074.html","https://www.maff.go.jp/j/pr/aff/2206/spe1_03.html"],"bold":false,"page":7,"item":"チーズ"},{"region":"北海道・東北","pref":"青森","name":"ごど","description":"青森県南部から岩手県に伝わる大豆を利用した発酵食品。地域や家庭によって用いる原料や麴、製法が異なる。","urls":["https://aomori-tourism.com/blog/2024/11/27824.html","https://hirakuogura.com/p-12001/"],"bold":true,"page":7,"item":"ごど"},{"region":"北海道・東北","pref":"青森","name":"すしこ","description":"蒸したもち米と赤シソやキャベツ、キュウリの古漬けなどと合わせて乳酸発酵させた「ごはんの漬物」。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sushiko_aomori.html"],"bold":false,"page":7,"item":"すしこ"},{"region":"北海道・東北","pref":"青森","name":"鮭の飯ずし","description":"サケを麴ともち米を合わせたものに漬けこみ、涼しい場所で乳酸発酵させた飯寿し。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sakeno_iizushi_aomori.html"],"bold":false,"page":7,"item":"鮭の飯ずし"},{"region":"北海道・東北","pref":"青森","name":"シードル","description":"青森はリンゴの生産量が圧倒的な日本一。リンゴを原料にした醸造酒のシードルは、低アルコール分で発泡性のものが多い。","urls":["https://www.city.hirosaki.aomori.jp/sangyo/nogyo/apple/cider.html"],"bold":true,"page":7,"item":"シードル"},{"region":"北海道・東北","pref":"青森","name":"甘酒","description":"甘酒婆という妖怪が伝わるなど地元に根付く。味噌・醤油会社のつくる麴甘酒のほか、清酒会社の酒粕甘酒、りんごを使った甘酒などある。ふるさと納税返礼品にも。","urls":["https://ja.wikipedia.org/wiki/甘酒婆"],"bold":true,"page":7,"item":"甘酒"},{"region":"北海道・東北","pref":"青森","name":"日本酒","description":"青森は清酒の地理的表示（GI）。GI青森は適度な米の旨味とまろやかな口当たりですっきりとした後味の清酒。","urls":["https://aomori-sake.or.jp/gi-aomori/"],"bold":true,"page":7,"item":"日本酒"},{"region":"北海道・東北","pref":"岩手","name":"ごど（ごど豆）","description":"青森県南部から岩手県に伝わる大豆を利用した発酵食品。地域や家庭によって用いる原料や麴、製法が異なり、岩手県では「ごど豆」と呼ばれるものもある。","urls":["https://iwate-u.repo.nii.ac.jp/records/11555/file_details/erar-v55n1p119-130.pdf?filename=erar-v55n1p119-130.pdf&file_order=0","https://www.jstage.jst.go.jp/article/msj7abst/69/0/69_91_2/_pdf/-char/ja"],"bold":true,"page":7,"item":"ごど"},{"region":"北海道・東北","pref":"岩手","name":"納豆（雪納豆）","description":"藁つとを干した大根葉を加熱したもので囲み、むしろや藁で保温して雪穴に保存して作った納豆、市販品はない。","urls":["https://www.town.nishiwaga.lg.jp/soshikikarasagasu/nourin/2/1/1_2/1304.html"],"bold":true,"page":8,"item":"納豆"},{"region":"北海道・東北","pref":"岩手","name":"浄法寺漆","description":"漆はウルシの木の樹液成分が酵素酸化して重合・固化したもの。樹液の採取後、微生物による発酵（漆が沸く、と呼ばれる）が収まってから出荷される。二戸市は国産漆の主産地。","urls":["https://jobojiurushi-seisankumiai.com/","https://www.ffpri.go.jp/pubs/kikan/documents/kikanffpri-48.pdf"],"bold":false,"page":8,"item":"浄法寺漆"},{"region":"北海道・東北","pref":"岩手","name":"日本酒","description":"岩手は清酒の地理的表示（GI）。GI岩手は当たり柔らかで米由来の芳醇な味わい、「南部杜氏」の技術に支えられた清酒。","urls":["https://iwatesake.jp/chiritekihyouji/"],"bold":true,"page":8,"item":"日本酒"},{"region":"北海道・東北","pref":"岩手","name":"どぶろく","description":"遠野市はどぶろく特区の第１号。農家民宿などで提供されている。","urls":["https://www.furusato-tax.jp/feature/detail/03208/15599"],"bold":true,"page":8,"item":"どぶろく"},{"region":"北海道・東北","pref":"宮城","name":"味噌（仙台味噌）","description":"米麴を使い大豆の比率が高い、辛口の赤味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/sendaimiso.html"],"bold":true,"page":8,"item":"味噌"},{"region":"北海道・東北","pref":"宮城","name":"日本酒","description":"昭和61年11月に「みやぎ・純米酒の県宣言」を行ない、特定名称酒の割合が９割以上と高いことが特徴。","urls":["https://miyagisake.jp/"],"bold":true,"page":8,"item":"日本酒"},{"region":"北海道・東北","pref":"宮城","name":"納豆","description":"宮城県は北海道に次ぐ大豆の主産地、納豆の三浦式醗酵室を開発し、1920年に仙台市で納豆菌の製造販売を始めた三浦二郎は「近代納豆の父」と呼ばれる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nattou_miyagi.html"],"bold":true,"page":8,"item":"納豆"},{"region":"北海道・東北","pref":"秋田","name":"しょっつる","description":"ハタハタを塩漬けにし1年以上魚が溶けるまで熟成させたものをこして、うまみ成分を取り出した魚醤。塩魚汁（しょっつる）。","urls":["https://oganavi.com/food/9/","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/29_23_akita.html"],"bold":false,"page":8,"item":"しょっつる"},{"region":"北海道・東北","pref":"秋田","name":"ハタハタ寿し","description":"ハタハタを用いた飯寿司。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/29_2_akita.html"],"bold":false,"page":8,"item":"ハタハタ寿し"},{"region":"北海道・東北","pref":"秋田","name":"いぶりがっこ","description":"天日干しが難しい地域で、囲炉裏で干した大根を用いたたくあん漬け。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/29_1_akita.html"],"bold":false,"page":8,"item":"いぶりがっこ"},{"region":"北海道・東北","pref":"秋田","name":"日本酒","description":"清酒の銘醸地の一つとして知られる。","urls":["https://osake.or.jp/"],"bold":true,"page":8,"item":"日本酒"},{"region":"北海道・東北","pref":"山形","name":"雪割納豆","description":"ひきわり納豆に塩と米麴を加えて二次発酵させたもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/yukiwari_natto.html"],"bold":false,"page":8,"item":"雪割納豆"},{"region":"北海道・東北","pref":"山形","name":"塩納豆","description":"庄内地方で作られる、塩漬けにした納豆と麴、昆布を混ぜた食品。","urls":["https://blog.exeamarume.co.jp/sakatanatto/","https://shonai-kuko.com/s_i090/"],"bold":false,"page":8,"item":"塩納豆"},{"region":"北海道・東北","pref":"山形","name":"紅花（紅餅）","description":"ベニバナの花弁から水溶性の成分を除いた後、発酵、乾燥させたものが紅餅。紅花染に用いる。","urls":["https://www.lib.yamagata-u.ac.jp/database/benibana/mame.html"],"bold":false,"page":8,"item":"紅花（紅餅）"},{"region":"北海道・東北","pref":"山形","name":"あけがらし","description":"米麴、ケシ、アサの実、生絞り醤油、三温糖を原料に、山形県の１社のみで作られている模様。ごはんや豆腐に乗せて食べる。","urls":["https://akegarashi.jp/framepage1.htm"],"bold":false,"page":8,"item":"あけがらし"},{"region":"北海道・東北","pref":"山形","name":"日本酒","description":"山形は清酒の地理的表示（GI）。GI山形はやわらかく、透明感のある酒質の清酒。","urls":["https://yamagata-sake.or.jp/"],"bold":true,"page":8,"item":"日本酒"},{"region":"北海道・東北","pref":"山形","name":"ワイン","description":"山形はぶどう酒の地理的表示（GI）。GI山形は四季の恵みから生まれるぶどう本来の香りと爽やかな酸の余韻のワイン。","urls":["https://giyamagata-wine.jp/gi/"],"bold":true,"page":8,"item":"ワイン"},{"region":"北海道・東北","pref":"福島","name":"三五八漬け","description":"塩が三、麴が五、米飯が八と言われる漬け床に野菜を漬ける漬物。福島県など、東北地方各地で作られている。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/30_14_fukushima.html"],"bold":false,"page":8,"item":"三五八漬け"},{"region":"北海道・東北","pref":"福島","name":"紅葉漬け","description":"阿武隈川流域で作られる、細かく刻んだサケを麴と塩で漬け込み、発酵させた保存食。","urls":["https://www.do-fukushima.or.jp/fukushimabimi/iwaki2018/abukumanokouyouduke/"],"bold":false,"page":8,"item":"紅葉漬け"},{"region":"北海道・東北","pref":"福島","name":"日本酒","description":"南会津と喜多方は清酒の地理的表示（GI）。GI南会津は後味すっきりフルーティー、GI喜多方は柔らかな丸みと芳醇な旨味の清酒。","urls":["http://sake-fukushima.jp/","https://japansake.or.jp/sake/sake-gi/gi%E5%8D%97%E4%BC%9A%E6%B4%A5/","https://japansake.or.jp/sake/sake-gi/gi%E5%96%9C%E5%A4%9A%E6%96%B9/"],"bold":true,"page":9,"item":"日本酒"},{"region":"関東","pref":"茨城","name":"納豆","description":"水戸納豆は粒の小さい早生大豆を活かしたもの。明治時代、鉄道の開通に合わせてお土産として売り出され、全国に広まった。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/natto_ibaraki.html"],"bold":true,"page":9,"item":"納豆"},{"region":"関東","pref":"茨城","name":"ごさい漬け","description":"以前はイワシ、現在はサンマのぶつ切りを塩漬けにし、発酵してきたら大根、赤唐辛子、ユズと一緒に漬け込んだもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/gosaizuke_ibaraki.html"],"bold":false,"page":9,"item":"ごさい漬け"},{"region":"関東","pref":"茨城","name":"醤油","description":"伝統的な木樽仕込みや再仕込み醤油が特徴。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/ibaraki_no_syoyu.html"],"bold":true,"page":9,"item":"醤油"},{"region":"関東","pref":"栃木","name":"日光たまり漬け","description":"野菜を塩漬けした後に塩抜きし、たまりを使った調味液に漬け込んだ日光名物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tamari_zuke.html"],"bold":false,"page":9,"item":"日光たまり漬け"},{"region":"関東","pref":"群馬","name":"焼まんじゅう","description":"小麦粉やもち米を麴を使ったどぶろくのような「もと種」で発酵させ、蒸した素まんじゅうを竹串に刺し、味噌だれをつけて焼いた群馬のソウルフード。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/32_26_gunma.html"],"bold":false,"page":9,"item":"焼まんじゅう"},{"region":"関東","pref":"群馬","name":"日本酒","description":"利根沼田は清酒の地理的表示（GI）。GI利根沼田は透明感のある味わいと適度な旨味の清酒。","urls":["https://japansake.or.jp/sake/sake-gi/gi%E5%88%A9%E6%A0%B9%E6%B2%BC%E7%94%B0/"],"bold":true,"page":9,"item":"日本酒"},{"region":"関東","pref":"埼玉","name":"秩父おなめ","description":"大豆と大麦で作った麴に塩水を加えて発酵させたもろみ味噌のような保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/33_25_saitama.html"],"bold":false,"page":9,"item":"秩父おなめ"},{"region":"関東","pref":"埼玉","name":"しゃくし菜漬け","description":"秩父地方の伝統野菜、しゃくし菜を塩漬けにし、乳酸発酵させた漬物","urls":["https://kyoudo-ryouri.com/food/1518.html"],"bold":false,"page":9,"item":"しゃくし菜漬け"},{"region":"関東","pref":"埼玉","name":"醤油","description":"川島町、日高市、川越市の蔵元は工場見学や醤油パーク等を醤油文化の情報発信に熱心で、木桶文化の存続にも取り組んでいる。","urls":["https://www.soysauce.or.jp/project/factory/list?area=kanto","https://www.syokubunka.or.jp/research/pdf/201807.pdf"],"bold":true,"page":9,"item":"醤油"},{"region":"関東","pref":"千葉","name":"豆造(とうぞ)","description":"大豆の煮汁に塩、米麴、納豆、水戻しした切り干し大根を加えて発酵させた食品。","urls":["https://ja.wikipedia.org/wiki/%E3%81%A8%E3%81%86%E3%81%9E"],"bold":false,"page":9,"item":"豆造(とうぞ)"},{"region":"関東","pref":"千葉","name":"醤油（濃口醤油）","description":"野田と銚子のある千葉県は江戸時代から醤油の主産地。","urls":["https://maruchiba.jp/feature/detail_528.html","https://www.choshi-geopark.jp/geosite/01/index.html"],"bold":true,"page":9,"item":"醤油"},{"region":"関東","pref":"千葉","name":"みりん（白みりん）","description":"流山は現在主流となっている色の淡いみりん（白みりん）発祥の地。","urls":["https://shiro-mirin.com/museum/"],"bold":true,"page":9,"item":"みりん"},{"region":"関東","pref":"東京","name":"くさや","description":"魚を特有のにおいがする「くさや液」と呼ばれる発酵液に浸けて作られる伊豆諸島の干物。","urls":["https://oshima-navi.com/gourmet/kusaya01.html"],"bold":false,"page":9,"item":"くさや"},{"region":"関東","pref":"東京","name":"べったら漬け","description":"塩で下漬けした大根を米麴と砂糖で漬けこんだ特産漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_8_tokyo.html"],"bold":false,"page":9,"item":"べったら漬け"},{"region":"関東","pref":"東京","name":"焼酎（東京島酒）","description":"東京島酒は地理的表示（GI）に指定。GI東京島酒は麦麴に由来する香味とやわらかで軽快な後口の芋焼酎、麦焼酎および両者のブレンドがある。","urls":["https://shimazake.com/853/"],"bold":true,"page":9,"item":"本格焼酎・泡盛"},{"region":"関東","pref":"神奈川","name":"久寿餅","description":"１年以上発酵させた小麦デンプンを蒸して作る和菓子。関東地方で作られ、川崎大師の門前町が有名。","urls":["https://www.alic.go.jp/joho-s/joho07_002929.html"],"bold":false,"page":9,"item":"久寿餅"},{"region":"関東","pref":"神奈川","name":"ビール","description":"明治３年、横浜に日本初のビール醸造所が作られた。","urls":["https://www.welcome.city.yokohama.jp/beer/"],"bold":true,"page":9,"item":"ビール"},{"region":"中部","pref":"新潟","name":"かんずり","description":"雪にさらした唐辛子に米麴とユズ、塩を混ぜて３年間熟成・発酵させた調味料。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kanzuri_niigata.html"],"bold":false,"page":10,"item":"かんずり"},{"region":"中部","pref":"新潟","name":"なめぜ","description":"大豆と麦で麴を作り、さらに米麴、塩、水を加えて発酵させた食品。お酒やご飯のお供。","urls":["https://howtoniigata.jp/feature/special-6/32186/"],"bold":false,"page":10,"item":"なめぜ"},{"region":"中部","pref":"新潟","name":"ふぐの子の粕漬け","description":"ゴマフグの卵巣を2年以上塩蔵した後、酒粕に漬けて長期間熟成、解毒させたもの。製造には免許が必要で、新潟では佐渡で作られる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/fuguno_ko_no_kasuzuke_niigata.html"],"bold":false,"page":10,"item":"ふぐの子の粕漬け"},{"region":"中部","pref":"新潟","name":"日本酒","description":"新潟は清酒の地理的表示（GI）。GI新潟は雑味の少ないきれいな味わいの酒質、地酒ブームの火付け役となった。","urls":["https://www.niigata-sake.or.jp/"],"bold":true,"page":10,"item":"日本酒"},{"region":"中部","pref":"新潟","name":"甘酒","description":"麴甘酒製造の清酒メーカーや全国的甘酒ブームの火付け役となった糀製造所がある。麴甘酒の健康効果の研究成果の情報発信など発酵文化にも寄与。","urls":["https://hakkou.or.jp/blog/2000/","https://www.hakkaisan.co.jp/research-development/"],"bold":true,"page":10,"item":"甘酒"},{"region":"中部","pref":"新潟","name":"塩麴","description":"江戸時代の塩麴漬けをヒントに、米麴、塩、水を混ぜて熟成させた発酵調味料で、北陸地方は消費量が多い。","urls":["https://nkpos.nikkei.co.jp/column/%E3%80%8C%E5%A1%A9%E3%81%93%E3%81%86%E3%81%98%E3%80%8D%E3%81%AF%E5%AE%9A%E7%95%AA%E8%AA%BF%E5%91%B3%E6%96%99%E3%81%A8%E3%81%AA%E3%81%A3%E3%81%9F","https://www.jstage.jst.go.jp/article/swsj/71/4/71_232/_pdf/-char/ja"],"bold":true,"page":10,"item":"塩麴"},{"region":"中部","pref":"新潟","name":"ワイン","description":"マスカット・ベーリーAなどを育種した上越市の川上善兵衛は日本ワインぶどうの父と呼ばれている。","urls":["https://doi.org/10.6013/jbrewsocjapan1988.86.210"],"bold":true,"page":10,"item":"ワイン"},{"region":"中部","pref":"富山","name":"バタバタ茶（富山黒茶）","description":"富山県朝日町で作られる、茶葉を蒸した後、60℃の高温で糸状菌などによって好気的に発酵させた茶。茶筅でバタバタと泡立てて飲む。","urls":["https://www.asahi-tabi.com/sanpo/2023/11/21/2312/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":10,"item":"バタバタ茶（富山黒茶）"},{"region":"中部","pref":"富山","name":"味噌（米麴味噌）","description":"水分が多く、やや塩分が高く、麴の歩合が高い味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kome_kozi_miso.html"],"bold":true,"page":10,"item":"味噌"},{"region":"中部","pref":"石川","name":"いしる・いしり","description":"能登地方に伝わる、イカの内臓、サバの骨や内臓、イワシを原料とする魚醤。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/isiri_isiru.html"],"bold":false,"page":10,"item":"いしる・いしり"},{"region":"中部","pref":"石川","name":"こんかいわし","description":"イワシを塩漬けし、さらにぬかに漬けて乳酸発酵を促したもの。「こんか」とは米ぬかのこと。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/konka_iwasi.html"],"bold":false,"page":10,"item":"こんかいわし"},{"region":"中部","pref":"石川","name":"ふぐの子のぬか漬け","description":"フグの卵巣を約半年～1年塩漬けにした後、米麴、ぬか、とうがらし、いしるとともに重石をして漬けたもので、この間に解毒される。さらに約半年酒粕に漬けたものも作られる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hugunoko_no_nukazuke.html","https://mikawa.shoko.or.jp/fugunoko/"],"bold":false,"page":10,"item":"ふぐの子のぬか漬け"},{"region":"中部","pref":"石川","name":"かぶらずし","description":"塩漬けしたカブに塩漬けしたブリなどの魚を挟み、米麴で発酵させたなれずし。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kaburazushi_ishikawa.html"],"bold":false,"page":10,"item":"かぶらずし"},{"region":"中部","pref":"石川","name":"ひねずし","description":"塩漬けした魚を米と漬け、発酵させた能登地方の保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hinezusi.html"],"bold":false,"page":10,"item":"ひねずし"},{"region":"中部","pref":"石川","name":"日本酒","description":"白山は清酒の地理的表示（GI）。GI白山は米の旨味を活かした豊かなこくの清酒。","urls":["https://sakehakusan.com/"],"bold":true,"page":10,"item":"日本酒"},{"region":"中部","pref":"石川","name":"醤油（大野醤油）","description":"濃口醤油の中で比較的色が薄く、加賀料理に欠かせないうまくち醤油","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/ono_syoyu.html"],"bold":true,"page":10,"item":"醤油"},{"region":"中部","pref":"福井","name":"へしこ","description":"サバなどの魚を塩漬けし、さらにぬか漬けにした保存食。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/heshiko_fukui.html"],"bold":false,"page":10,"item":"へしこ"},{"region":"中部","pref":"福井","name":"にしんすし","description":"身欠きニシンを水に戻し、大根、ニンジンなどと麴に漬けた郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nishin_sushi_fukui.html"],"bold":false,"page":11,"item":"にしんすし"},{"region":"中部","pref":"福井","name":"はまなみそ","description":"米麴の甘酒に豆麴や醤油、塩漬けナスや、シソの実、ショウガなどを加え、20日ほど熟成させる冬の郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/hamana_miso_fukui.html"],"bold":false,"page":11,"item":"はまなみそ"},{"region":"中部","pref":"山梨","name":"ワイン","description":"山梨はぶどう酒の地理的表示（GI）。GI山梨はぶどう本来の品種特性がよく現れたバランスの良いワイン。甲州の主産地で日本ワイン発祥の地。","urls":["https://wine.or.jp/"],"bold":true,"page":11,"item":"ワイン"},{"region":"中部","pref":"山梨","name":"日本酒","description":"山梨は清酒の地理的表示（GI）。GI山梨は恵まれた自然的条件から生まれる柔らかで清らかな味わいの清酒。","urls":["https://www.yamanashi-sake.jp/"],"bold":true,"page":11,"item":"日本酒"},{"region":"中部","pref":"山梨","name":"味噌（甲州味噌）","description":"米麴と麦麴の両方を使う珍しい味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kosyu_miso.html"],"bold":true,"page":11,"item":"味噌"},{"region":"中部","pref":"長野","name":"すんき","description":"赤カブの葉を、塩を使わず「すんき種」を加えて乳酸発酵させた無塩の漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sunki_zuke_nagano.html"],"bold":false,"page":11,"item":"すんき"},{"region":"中部","pref":"長野","name":"おなっとう","description":"米飯に麴を混ぜて作る甘い郷土料理。","urls":["https://www.youtube.com/watch?v=aVRlVf2s_Is"],"bold":false,"page":11,"item":"おなっとう"},{"region":"中部","pref":"長野","name":"野沢菜漬け","description":"野沢菜を塩漬けし、乳酸発酵させたもの。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nozawana_zuke_nagano.html"],"bold":false,"page":11,"item":"野沢菜漬け"},{"region":"中部","pref":"長野","name":"ワイン","description":"長野はぶどう酒の地理的表示（GI）。GI長野はぶどう品種ごとの本質的な香味の特性がはっきりと表れたワイン。高品質なシャルドネやメルロ等で知られる。","urls":["https://www.nagano-wine.jp/"],"bold":true,"page":11,"item":"ワイン"},{"region":"中部","pref":"長野","name":"日本酒","description":"長野と信濃大町は清酒の地理的表示（GI）。GI長野は雑味の少ない濃厚な味わいときれいで穏やかな香り、GI信濃大町は米由来の特徴的な香味が際立った酒。","urls":["https://japansake.or.jp/sake/sake-gi/gi%e9%95%b7%e9%87%8e/","https://japansake.or.jp/sake/sake-gi/gi%e4%bf%a1%e6%bf%83%e5%a4%a7%e7%94%ba/"],"bold":true,"page":11,"item":"日本酒"},{"region":"中部","pref":"長野","name":"シードル","description":"リンゴの生産量が国内２位で、シードルの生産者も多い。","urls":["https://www.go-nagano.net/food-and-drink/id19460"],"bold":true,"page":11,"item":"シードル"},{"region":"中部","pref":"岐阜","name":"ねずし","description":"小さく切った塩マスと塩もみした大根やニンジンを、麴を混ぜた米飯に2週間から20日ほど漬け込んだ岐阜県飛騨・中濃地方の正月料理。「寝酢」とも書かれ、文字通り寝かせて作るなれずしの一種。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_12_gifu.html"],"bold":false,"page":11,"item":"ねずし"},{"region":"中部","pref":"岐阜","name":"鮎なれずし","description":"塩漬けした鮎の腹に、炊き立てのご飯を詰め、2ヵ月ほど樽に漬け込み乳酸発酵させる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_7_gifu.html"],"bold":false,"page":11,"item":"鮎なれずし"},{"region":"中部","pref":"岐阜","name":"しな漬","description":"飛騨の特産品・赤カブのほか、キュウリ、大根、キノコなどを塩漬けにしたもの","urls":["https://gifu.mytabi.net/hida-shinazuke.php"],"bold":false,"page":11,"item":"しな漬"},{"region":"中部","pref":"岐阜","name":"柿渋","description":"青い未熟な渋柿をしぼり、発酵後２～５年熟成させたもの。防虫効果、防腐効果、防水効果を示し、日本酒の滓下げにも用いられる。","urls":["https://www.jstage.jst.go.jp/article/kakyoshi/64/7/64_348/_pdf/-char/ja"],"bold":true,"page":11,"item":"柿渋"},{"region":"中部","pref":"岐阜","name":"どぶろく","description":"白川郷のどぶろく祭りが有名。五穀豊穰・家内安全・里の平和を山の神様に祈願する祭礼に神酒として「どぶろく」が用いられ、人々にも振る舞われる.","urls":["https://www.vill.shirakawa.lg.jp/2223.htm"],"bold":true,"page":11,"item":"どぶろく"},{"region":"中部","pref":"静岡","name":"浜納豆","description":"大豆麴に塩水を加え、樽で１年以上発酵・熟成させたもの。寺納豆が浜名湖周辺や愛知県豊橋市に伝わり、徳川家康が浜名の納豆を好んだと言われる。","urls":["https://www.city.hamamatsu.shizuoka.jp/foodpark/hamamatsu-foods/hamanatto.html"],"bold":false,"page":11,"item":"浜納豆"},{"region":"中部","pref":"静岡","name":"鰹節（本枯節）","description":"遠洋鰹の水揚げ量日本一の焼津で作られる鰹節、焼津式と呼ばれる焙乾方法が特徴。","urls":["https://www.katsuobushi-kyo.or.jp/","https://www.youtube.com/watch?v=qFI4Bpfdsms"],"bold":true,"page":11,"item":"鰹節"},{"region":"中部","pref":"静岡","name":"わさび漬け","description":"ワサビの刻んだ葉、茎、根を酒粕に漬けた静岡の特産品。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/36_3_shizuoka.html"],"bold":false,"page":11,"item":"わさび漬け"},{"region":"中部","pref":"静岡","name":"日本酒","description":"静岡は清酒の地理的表示（GI）。GI静岡は淡麗で穏やかな旨味のきれいで丸みのある酒質の清酒。","urls":["https://www.shizuoka-sake.jp/"],"bold":true,"page":12,"item":"日本酒"},{"region":"中部","pref":"愛知","name":"みりん（三河みりん）","description":"もち米、米麴、本格焼酎を原料にした伝統的な製法で作られるみりん。","urls":["https://hakko-aichi.jp/culture/detail/3/"],"bold":true,"page":12,"item":"みりん"},{"region":"中部","pref":"愛知","name":"味噌（八丁味噌）","description":"蒸した大豆を握りこぶし大に丸めて麴を作り、木桶に仕込み、石の重しを積み上げて作られる濃色の味噌。","urls":["https://www.hatcho.jp/index.html"],"bold":true,"page":12,"item":"味噌"},{"region":"中部","pref":"愛知","name":"醤油（溜醤油、白醤油）","description":"溜醤油は大豆が主原料のとろみと濃いうま味と色が特徴の醤油。白醤油は小麦が主原料の色の淡い醤油。","urls":["https://www.aichimisotamari.or.jp/pages/52/"],"bold":true,"page":12,"item":"醤油"},{"region":"中部","pref":"愛知","name":"酢","description":"江戸時代に酒粕を再発酵させて作った赤酢が始まり。知多半島は現在も酢の主産地。","urls":["https://hakko-aichi.jp/culture/detail/4/"],"bold":true,"page":12,"item":"酢"},{"region":"中部","pref":"愛知","name":"日本酒","description":"古事記、日本書紀の時代から酒造りが行われ、現在でも製造数量６位。酒粕がお酢につながる文化的背景も。","urls":["https://www.aichi-sake.or.jp/sakestory/"],"bold":true,"page":12,"item":"日本酒"},{"region":"中部","pref":"愛知","name":"守口漬","description":"細く、長さが１ｍ以上もある守口大根を塩漬け、酒粕漬けのあと、みりん粕に漬けた伝統的な漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/moriguchi_zuke.html"],"bold":false,"page":12,"item":"守口漬"},{"region":"近畿","pref":"三重","name":"鰹節（波切節）","description":"志摩市大王町波切地区で、手火山法と呼ばれる燻製工程を繰り返して水分を極限まで抜いた製法で作られる鰹節。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nakiribusi.html"],"bold":true,"page":12,"item":"鰹節"},{"region":"近畿","pref":"三重","name":"日本酒","description":"三重は清酒の地理的表示（GI）。GI三重は暖かみがあり芳醇な酒質の清酒。","urls":["http://www.mie-sake.or.jp/"],"bold":true,"page":12,"item":"日本酒"},{"region":"近畿","pref":"滋賀","name":"鮒ずし","description":"琵琶湖でとれる子持ちのニゴロブナを塩漬けにした後、米飯に漬け、乳酸発酵させたなれずし。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/funa_zushi_shiga.html"],"bold":false,"page":12,"item":"鮒ずし"},{"region":"近畿","pref":"滋賀","name":"日本酒","description":"滋賀は清酒の地理的表示（GI）。GI滋賀は米由来のふくよかな甘味と旨味の清酒。","urls":["https://shiga-sake.net/"],"bold":true,"page":12,"item":"日本酒"},{"region":"近畿","pref":"京都","name":"寺納豆","description":"蒸煮し、はったい粉（炒った大麦または小麦の粉）をまぶした大豆で麴を作り、塩水に浸けて熟成させた後乾燥させた保存食。大徳寺などで作られる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tera_natto.html"],"bold":false,"page":12,"item":"寺納豆"},{"region":"近畿","pref":"京都","name":"柿渋","description":"青い未熟な渋柿をしぼり、発酵後２～５年熟成させたもの。防虫効果、防腐効果、防水効果を示し、日本酒の滓下げにも用いられる。","urls":["https://www.jstage.jst.go.jp/article/kakyoshi/64/7/64_348/_pdf/-char/ja"],"bold":true,"page":12,"item":"柿渋"},{"region":"近畿","pref":"京都","name":"京漬物","description":"すぐき漬け、千枚漬け、しば漬けなど。京都では、洛外で栽培された各種の野菜を塩蔵保存したことに始まり、漬物文化が発展した","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kyo_tukemono.html"],"bold":false,"page":12,"item":"京漬物"},{"region":"近畿","pref":"京都","name":"味噌（白味噌）","description":"米麴の比率が高く、黄色味を帯びた白色で甘さが特徴的の味噌","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/siromiso.html"],"bold":true,"page":12,"item":"味噌"},{"region":"近畿","pref":"京都","name":"日本酒","description":"京都は清酒の地理的表示（GI）。GI京都は調和のとれた丸みのある口当たりと膨らみのある味わいの清酒。","urls":["https://kyoto-sake.sakura.ne.jp/ja/"],"bold":true,"page":12,"item":"日本酒"},{"region":"近畿","pref":"京都","name":"醤油","description":"精進料理、懐石料理が発達した京都では、色が薄く、食材を引き立てる淡口醤油が多い。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kyoto_no_syoyu.html"],"bold":true,"page":12,"item":"醤油"},{"region":"近畿","pref":"大阪","name":"僧坊酒","description":"室町時代、金剛寺で造られていた僧房酒を蘇らせた超甘口の酒。","urls":["https://nihonshu-tourism.com/archives/3842"],"bold":true,"page":12,"item":"僧坊酒"},{"region":"近畿","pref":"大阪","name":"ワイン","description":"大阪はぶどう酒の地理的表示（GI）。GI大阪は新鮮で美しいぶどう由来の凝縮された果実味と穏やかな酸味のワイン、デラウェアのワインが特徴。","urls":["https://www.osaka-winery.com/japan/gi%E5%A4%A7%E9%98%AA/"],"bold":true,"page":12,"item":"ワイン"},{"region":"近畿","pref":"大阪","name":"ウイスキー","description":"日本初のモルトウイスキーの蒸留所が作られた島本町山崎は日本のウイスキーのふるさとと呼ばれる。","urls":["https://www.town.shimamoto.lg.jp/site/kankou/1424.html","https://jwic.jp/history/"],"bold":true,"page":13,"item":"ウイスキー"},{"region":"近畿","pref":"兵庫","name":"日本酒","description":"灘五郷、はりま、伊丹は清酒の地理的表示（GI）。GI灘五郷は後味の切れの良い酒質、GIはりまは兵庫県産山田錦から生まれる軽快な酒質、GI伊丹は甘味・旨味・酸味のバランスが良くキレのある味わい。","urls":["https://hyogo-sake.or.jp/","https://www.nadagogo.ne.jp/","https://www.gi-harima.jp/","https://itami-sake.com/about/"],"bold":true,"page":13,"item":"日本酒"},{"region":"近畿","pref":"兵庫","name":"醤油（淡口醤油）","description":"たつの市は淡口醤油発祥の地。高めの塩分とバランスをとるために甘酒を加えることも特徴。","urls":["https://web.pref.hyogo.lg.jp/sr09/jibasan/05.html"],"bold":true,"page":13,"item":"醤油"},{"region":"近畿","pref":"奈良","name":"奈良漬け","description":"ウリなどの野菜を塩漬けした後、酒粕に何度も漬け替えて作られる奈良県の特産品。最近、乳酸菌が働いていることが報告された。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/naraduke.html"],"bold":false,"page":13,"item":"奈良漬け"},{"region":"近畿","pref":"奈良","name":"僧坊酒","description":"正暦寺の僧房酒造りで行われた菩提泉に加え、菩提酛を復活させる取組も。","urls":["https://shoryakuji.jp/sake-birthplace.html"],"bold":true,"page":13,"item":"僧坊酒"},{"region":"近畿","pref":"奈良","name":"味噌（えんどう味噌）","description":"全国でも珍しいえんどう豆から作られる味噌。甘みが特徴。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/endoumiso.html"],"bold":true,"page":13,"item":"味噌"},{"region":"近畿","pref":"奈良","name":"醤油（古代ひしお、奈良醤油）","description":"各蔵の特徴がある醤油に加え、奈良時代の穀醤の味を復活させた古代ひしおの製造にも取り組まれている。","urls":["https://nara-shoyu.jp/"],"bold":true,"page":13,"item":"醤油"},{"region":"近畿","pref":"和歌山","name":"なれずし","description":"日本三大なれずしの１つ。塩漬けしたサバ、サンマを米飯に乗せ、葉できっちり巻いて乳酸発酵させる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nare_zushi_wakayama.html"],"bold":false,"page":13,"item":"なれずし"},{"region":"近畿","pref":"和歌山","name":"味噌（金山寺味噌）","description":"ウリ、ナス、シソ、ショウガを大豆、麦、米の3種類の麴で仕込むおかず味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kinzanji_miso_wakayama.html"],"bold":true,"page":13,"item":"味噌"},{"region":"近畿","pref":"和歌山","name":"醤油（湯浅醤油）","description":"湯浅は日本の醤油醸造発祥の地で、日本遺産に指定。","urls":["https://japan-heritage.bunka.go.jp/ja/stories/story047/"],"bold":true,"page":13,"item":"醤油"},{"region":"中国","pref":"鳥取","name":"スルメの麴漬け","description":"スルメイカを海風に1日干した後、刻み、野菜の塩漬けと一緒麴に漬け込んだ郷土料理。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/surume_no_kouji_zuke_tottori.html"],"bold":false,"page":13,"item":"スルメの麴漬け"},{"region":"中国","pref":"鳥取","name":"日本酒","description":"鳥取は清酒の地理的表示（GI）。口当たりが柔らかでふくよかな米の旨味の清酒。","urls":["https://www.pref.tottori.lg.jp/jizake/"],"bold":true,"page":13,"item":"日本酒"},{"region":"中国","pref":"島根","name":"鯖の塩辛","description":"新鮮なマサバの頭を落とし、内臓ごと輪切りにし、長年継ぎ足してきた塩辛のたれに漬け込んだもの","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/sabano_siokara.html"],"bold":false,"page":13,"item":"鯖の塩辛"},{"region":"中国","pref":"島根","name":"地伝酒","description":"戦前まで作られていた灰持酒の１種を平成２年に復活、アゴ野焼きなどの出雲料理に使われる","urls":["https://www.toyonoaki.com/jidenshu/revival-story/"],"bold":false,"page":13,"item":"地伝酒"},{"region":"中国","pref":"島根","name":"醤油（こじょうゆ味噌）","description":"小麦や米、大豆で麴（こじょうゆ糀）を作り、塩、みりん、砂糖を加えて発酵させた、隠岐島地方の味噌と醤油の中間のような調味料","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kozyoyu_miso.html"],"bold":true,"page":13,"item":"醤油"},{"region":"中国","pref":"岡山","name":"日本酒","description":"備前地域は幻の酒米と呼ばれた雄町の主産地。","urls":["http://bizen-omachi.pref.okayama.jp/"],"bold":true,"page":13,"item":"日本酒"},{"region":"中国","pref":"広島","name":"広島菜漬","description":"広島菜を二度塩漬けにしたのち、麴などと一緒に本漬けにし、乳酸発酵させる。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hiroshimana_zuke.html"],"bold":false,"page":13,"item":"広島菜漬"},{"region":"中国","pref":"広島","name":"日本酒","description":"酒蔵が集まる西条は銘醸地の一つ。県内には初めて貴醸酒を造った酒蔵も。｢軟水醸造法｣や吟醸酒に必要な竪型精米機は広島で開発。","urls":["https://hirosake.or.jp/","https://www.pref.hiroshima.lg.jp/lab/info/sake-hiroshima/"],"bold":true,"page":13,"item":"日本酒"},{"region":"中国","pref":"山口","name":"日本酒","description":"萩は日本酒の地理的表示（GI）。GI萩は米由来のふくよかで上品な旨味の清酒。","urls":["https://japansake.or.jp/sake/sake-gi/gi%e8%90%a9/"],"bold":true,"page":14,"item":"日本酒"},{"region":"中国","pref":"山口","name":"甘酒（あまぎゃあ）","description":"萩近くの佐々並に伝わる甘酒の一種で、麴と炊いたもち米に水を加えて温めて作る甘粥（地元の発音ではあまぎゃあ）。","urls":["https://hirakuogura.com/p-12337/"],"bold":true,"page":14,"item":"甘酒"},{"region":"中国","pref":"山口","name":"醤油（柳井の甘露醤油）","description":"塩水の代わりに生揚げ醤油で仕込む再仕込醤油、濃厚なうま味と香りから甘露と称される。","urls":["https://www.alic.go.jp/joho-s/joho07_002775.html"],"bold":true,"page":14,"item":"醤油"},{"region":"四国","pref":"徳島","name":"藍","description":"アイ（藍）の葉を細かく刻み、乾燥させ、発酵させて作られるのが藍染めの原料のすくも、阿波地方は伝統的なすくもの主産地。","urls":["https://www.pref.tokushima.lg.jp/tafftsc/material/kyunougyou/7216556/"],"bold":false,"page":14,"item":"藍"},{"region":"四国","pref":"徳島","name":"阿波晩茶","description":"徳島県の山間部で作られる、茶葉をゆでた後、乳酸発酵させ、乾燥させた独特の風味のお茶。","urls":["https://www.kamikatsuawabanchakyokai.com/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":14,"item":"阿波晩茶"},{"region":"四国","pref":"香川","name":"いかなご醤油","description":"1955年頃まで家庭でも作られていた、イカナゴを原料にした魚醤。その後途絶えたが、関係者の努力によって復活。","urls":["https://www.jstage.jst.go.jp/article/jbrewsocjapan1988/88/2/88_2_135/_pdf/-char/en"],"bold":false,"page":14,"item":"いかなご醤油"},{"region":"四国","pref":"香川","name":"醤油","description":"小豆島では、大型の木桶を用いた天然醸造による醤油づくりの伝統が残されており、近年は、木桶の製造技術の継承にも努めている。","urls":["https://online.bunka.go.jp/heritages/detail/524517"],"bold":true,"page":14,"item":"醤油"},{"region":"四国","pref":"香川","name":"味噌（さぬき白味噌）","description":"米麴の割合が高く、塩分が低めで甘口、色の淡い味噌。さぬき白味噌は地理的表示（GI）に指定。","urls":["https://www.maff.go.jp/j/shokusan/gi_act/register/0124/index.html"],"bold":true,"page":14,"item":"味噌"},{"region":"四国","pref":"愛媛","name":"石鎚黒茶","description":"蒸した茶葉を糸状菌による好気発酵の後、乳酸菌による嫌気発酵の二段階で発酵させ、天日乾燥させた後発酵茶。","urls":["https://ishizuchikurocha.com/about/","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":14,"item":"石鎚黒茶"},{"region":"四国","pref":"愛媛","name":"味噌（麦味噌）","description":"米の裏作として作られる麦で作った麴で仕込まれた味噌。愛媛の麦味噌は麴の使用割合が高く、芳醇な香と上品な甘さが特徴。宇和島では大豆を使わない製品も作られている。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/miso_shiru_ehime.html","https://www.hakko-blend.com/food/rare/18.html"],"bold":true,"page":14,"item":"味噌"},{"region":"四国","pref":"高知","name":"酒盗","description":"カツオの胃や腸などを塩に漬け込んで発酵、熟成させた珍味。塩辛は魚介類の内臓と身を使うが、酒盗は内臓のみを用いて熟成期間も長い点が特徴。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/syutou.html"],"bold":false,"page":14,"item":"酒盗"},{"region":"四国","pref":"高知","name":"碁石茶","description":"収穫した茶葉を蒸した後にカビ付けし、次に漬け物と同じ要領で重石をのせて漬け込む「二段階発酵」させる後発酵茶。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/goisitya.html","https://www.maff.go.jp/j/pr/aff/2204/spe1_03.html"],"bold":false,"page":14,"item":"碁石茶"},{"region":"四国","pref":"高知","name":"土佐漆喰","description":"のりの代わりに発酵させた稲わらを消石灰に混ぜて作る漆喰で、耐水性が高い","urls":["https://www.pref.kochi.lg.jp/doc/2026012600142/"],"bold":false,"page":14,"item":"土佐漆喰"},{"region":"四国","pref":"高知","name":"日本酒","description":"大皿に盛りつけた皿鉢料理にあう、淡麗辛口の地酒の産地として知られる。","urls":["https://tosa-sake.jp/"],"bold":true,"page":14,"item":"日本酒"},{"region":"九州・沖縄","pref":"福岡","name":"博多練酒","description":"米ともち米を乳酸発酵させ、米麴と蒸米、水を入れてアルコール発酵させたもろみを臼ですって作られる、室町時代の製法を復刻させた酒。","urls":["https://www.jstage.jst.go.jp/article/jbrewsocjapan1915/71/4/71_4_242/_pdf/-char/ja"],"bold":false,"page":14,"item":"博多練酒"},{"region":"九州・沖縄","pref":"福岡","name":"日本酒","description":"福岡は清酒の地理的表示（GI）。GI福岡は馥郁たる香りを持ち、旨味に富み余韻がきれいな酒。","urls":["http://www.fukuoka-sake.org/"],"bold":true,"page":14,"item":"日本酒"},{"region":"九州・沖縄","pref":"福岡","name":"焼酎（早苗饗焼酎）","description":"田植えの共同作業を終えた後に行われた宴「早苗饗（さなぶり）」で振る舞われた、清酒の酒粕を蒸留して造られる粕取焼酎","urls":["http://www.fukuoka-sake.org/cms/tsuushin/cat154/500/index.html"],"bold":true,"page":14,"item":"本格焼酎・泡盛"},{"region":"九州・沖縄","pref":"福岡","name":"高菜漬け","description":"福岡県の伝統野菜である三池高菜を塩漬けにし、乳酸発酵させた漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/takana_zuke.html"],"bold":true,"page":14,"item":"高菜漬け"},{"region":"九州・沖縄","pref":"佐賀","name":"松浦漬・玄海漬","description":"鯨基地として栄えた唐津地方で、クジラを余すところなく利用するため、軟骨を粕漬けにした珍味。","urls":["https://xn--btr924e.jp/chinmi/mk"],"bold":false,"page":15,"item":"松浦漬・玄海漬"},{"region":"九州・沖縄","pref":"佐賀","name":"日本酒","description":"佐賀は清酒の地理的表示（GI）。GI佐賀はふくよかな米の旨みを多く残す芳醇な酒。","urls":["https://www.sagasake.or.jp/"],"bold":true,"page":15,"item":"日本酒"},{"region":"九州・沖縄","pref":"長崎","name":"せんだんご","description":"サツマイモを切って水にさらした後、発酵させ、団子状にしてカビを生やし、再度水にさらしてデンプンを得て乾燥させた食材。対馬で千の工程と言われるほど手間をかけて作られる。","urls":["https://tsushima-kanko.net/info/997"],"bold":false,"page":15,"item":"せんだんご"},{"region":"九州・沖縄","pref":"長崎","name":"納豆味噌","description":"もろみ味噌に裸麦、昆布、ショウガをまぜ、水飴等で味付けした食品で、納豆は含まれていない。","urls":["https://oishii-minamishimabara.jp/certified_product/no120/","https://hakkou-kiyoya.com/product/%e5%b3%b6%e5%8e%9f%e7%b4%8d%e8%b1%86%e3%81%bf%e3%81%9d-300g/"],"bold":false,"page":15,"item":"納豆味噌"},{"region":"九州・沖縄","pref":"長崎","name":"焼酎（壱岐）","description":"壱岐は麦焼酎の地理的表示（GI）。GI壱岐は麦の香りと米麴の甘みと厚みのある味わいの焼酎。","urls":["https://ikishochu.org/iki-distilled-spirits/","https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/geographical-gndication-and-regional-brands/"],"bold":true,"page":15,"item":"本格焼酎・泡盛"},{"region":"九州・沖縄","pref":"熊本","name":"干し味噌","description":"醤油粕に柚の皮やショウガ、ゴマ、コショウなどをすり入れ小さな団子にして干したもの。ご飯にかけて食べる。","urls":["https://kumamoto-museum.net/blog/archives/chiiki/1425"],"bold":false,"page":15,"item":"干し味噌"},{"region":"九州・沖縄","pref":"熊本","name":"肥後の赤酒","description":"清酒とほぼ同じ製法の途中で灰を加えて造る灰持酒（あくもちざけ）の一つ。アルカリ性の条件で糖分とアミノ酸が反応し、赤色を示す。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akazake.html"],"bold":false,"page":15,"item":"肥後の赤酒"},{"region":"九州・沖縄","pref":"熊本","name":"高菜漬け","description":"阿蘇高菜漬けと呼ばれ、漬けて3日ほどで食べられる新漬け（浅漬け）と、半年かけて乳酸発酵させ酸味とピリ辛の味わいを楽しむ古漬けがある。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/aso_takana_zuke_kumamoto.html"],"bold":true,"page":15,"item":"高菜漬け"},{"region":"九州・沖縄","pref":"熊本","name":"焼酎（球磨）","description":"球磨は米焼酎の地理的表示（GI）。GI球磨は米由来のまろやかな甘さを感じる味わいと清涼感のある香味の焼酎、16世紀前半からの永い歴史を持つ。","urls":["https://kumashochu.or.jp/wp/","https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/geographical-gndication-and-regional-brands/"],"bold":true,"page":15,"item":"本格焼酎・泡盛"},{"region":"九州・沖縄","pref":"大分","name":"鮎醤油","description":"アユの魚醤、匂いの癖がないことが特徴。","urls":["https://shokunotasuki.jp/feature/maruhara/"],"bold":false,"page":15,"item":"鮎醤油"},{"region":"九州・沖縄","pref":"大分","name":"塩麴","description":"江戸時代の塩麴漬けをヒントに、米麴、塩、水を混ぜて熟成させた発酵調味料。大分の老舗糀屋がブームの火付け役。","urls":["https://kojiya.jp/company/myouhou/"],"bold":true,"page":15,"item":"塩麴"},{"region":"九州・沖縄","pref":"大分","name":"どぶろく","description":"杵築市大田の白髭田原神社で行われるどぶろく祭りは、毎年10月の大祭に氏子たちによって仕込まれたどぶろくを五穀豊穣を感謝して神様に捧げる神事。和銅3年（710）から1300年以上も続いている。","urls":["https://oitaisan.com/heritage/%e3%81%a9%e3%81%b6%e3%82%8d%e3%81%8f-%e7%a5%ad%e3%82%8a/"],"bold":true,"page":15,"item":"どぶろく"},{"region":"九州・沖縄","pref":"宮崎","name":"だんだん納豆","description":"米麴、大豆、ニンジン、昆布、ショウガを自然の納豆菌で発酵させた椎葉村の伝統。","urls":["https://ameblo.jp/m-tokusan/entry-10355409692.html"],"bold":false,"page":15,"item":"だんだん納豆"},{"region":"九州・沖縄","pref":"宮崎","name":"むかでのり","description":"日南海岸でとれるキリンサイという海藻を天日干しにし、それを煮出して寒天状にしさらに味噌漬けにしたもの。","urls":["https://hirakuogura.com/p-12177/"],"bold":false,"page":15,"item":"むかでのり"},{"region":"九州・沖縄","pref":"鹿児島","name":"ナリ味噌（蘇鉄味噌）","description":"奄美大島や徳之島で作られる、ソテツの実「ナリ」を砕いて水にさらし、米と混ぜて蒸して麴にしたナリ麴で仕込んだ味噌。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/narimiso.html"],"bold":false,"page":15,"item":"ナリ味噌（蘇鉄味噌）"},{"region":"九州・沖縄","pref":"鹿児島","name":"みき","description":"湯に米粉と砂糖を入れて加熱し、30℃程度に冷めたらすり下ろしたサツマイモの絞り汁を加え、冷暗所で乳酸発酵させた奄美地方の飲み物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/miki_kagoshima.html"],"bold":false,"page":15,"item":"みき"},{"region":"九州・沖縄","pref":"鹿児島","name":"薩摩地酒","description":"清酒とほぼ同じ製法の途中で灰を加えて造る灰持酒（あくもちざけ）の一つで、郷土料理の味付けに使われることが多い。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akumotizake.html"],"bold":false,"page":16,"item":"薩摩地酒"},{"region":"九州・沖縄","pref":"鹿児島","name":"鰹節（本枯節）","description":"枕崎市は鰹節で全国の約5割を占める日本一の産地。","urls":["https://www.city.makurazaki.lg.jp/soshiki/suisan/5320.html"],"bold":true,"page":16,"item":"鰹節"},{"region":"九州・沖縄","pref":"鹿児島","name":"焼酎（黒糖）","description":"奄美群島でのみ造られる、黒糖と米麴を原料とする焼酎。","urls":["https://www.honkakushochu.or.jp/campaign/amami/"],"bold":true,"page":16,"item":"本格焼酎・泡盛"},{"region":"九州・沖縄","pref":"鹿児島","name":"焼酎（薩摩）","description":"薩摩は芋焼酎の地理的表示（GI）。GI薩摩はサツマイモ特有の華やかさと芳醇な香りが調和し、甘く濃厚な味わいの焼酎。","urls":["https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/geographical-gndication-and-regional-brands/"],"bold":true,"page":16,"item":"本格焼酎・泡盛"},{"region":"九州・沖縄","pref":"鹿児島","name":"酢（壺造り黒酢）","description":"米麴・蒸し米・水を陶器の壺に入れて屋外に置き、糖化、アルコール発酵、酢酸発酵を自然に進行させて作られる酢。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tubozukurikurozu.html","https://www.pref.kagoshima.jp/ag04/sangyo-rodo/nogyo/suisin/ninsyou/furusatokomezu.html"],"bold":true,"page":16,"item":"酢"},{"region":"九州・沖縄","pref":"鹿児島","name":"酢（きび酢）","description":"奄美群島のサトウキビの搾り汁を原料に自然発酵で作られる酢","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kibisu.html"],"bold":true,"page":16,"item":"酢"},{"region":"九州・沖縄","pref":"鹿児島","name":"山川漬","description":"干し大根を3か月以上、底にすのこを敷いた甕で塩漬けにし、乳酸発酵・熟成させた伝統的な漬物。","urls":["https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/yamagawazuke.html","https://www.pref.kagoshima.jp/ag04/sangyo-rodo/nogyo/suisin/ninsyou/furusatoyamagawaduke.html"],"bold":false,"page":16,"item":"山川漬"},{"region":"九州・沖縄","pref":"沖縄","name":"豆腐よう","description":"陰干しした豆腐を紅麴と泡盛を含む漬け汁に漬け、発酵・熟成させた沖縄の特産品。","urls":["https://www.jstage.jst.go.jp/article/myco/63/1/63_67/_pdf/-char/ja"],"bold":false,"page":16,"item":"豆腐よう"},{"region":"九州・沖縄","pref":"沖縄","name":"るくじゅう","description":"島豆腐を切って塩水にくぐらせ、数日天日干しをしながら発酵させた食材、焼いたり揚げたりして食べる幻の沖縄料理。","urls":["https://www.dee-okinawa.com/topics/2014/01/rukuju.html"],"bold":false,"page":16,"item":"るくじゅう"},{"region":"九州・沖縄","pref":"沖縄","name":"酢（もろみ酢）","description":"泡盛を蒸留した後のもろみをろ過した飲料。酢と呼ばれるが酢酸ではなくクエン酸を含み、アミノ酸も豊富。","urls":["https://moromisu.or.jp/moromisu/whats-moromisu/"],"bold":true,"page":16,"item":"酢"},{"region":"九州・沖縄","pref":"沖縄","name":"焼酎（琉球泡盛、花酒）","description":"琉球は泡盛の地理的表示（GI）。米麴に由来する芳醇な味わいの焼酎、与那国島で造られる花酒はアルコール分が高く、酒税法上はスピリッツに分類される。","urls":["https://okinawa-awamori.or.jp/"],"bold":true,"page":16,"item":"本格焼酎・泡盛"}]};

const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const GYO = ["あ","か","さ","た","な","は","ま","や","ら","わ"];
// lit = 地図で県を光らせている品目名（複数地域の品目から県を押したとき）／here = 行き来の元になった品目名
const state = { tab: "map", q: "", pref: "", lit: "", here: "" };

$("#src").href = DATA.source_url;
const IDX = new Map(DATA.items.map((e, i) => [e.name, i]));

function hit(e) {
  if (!state.q) return true;
  const q = state.q;
  return e.name.includes(q) || e.description.includes(q);
}
// 県の行の絞り込み：光らせ中はその品目だけ、そうでなければ検索
function phit(e) { return state.lit ? e.item === state.lit : hit(e); }
function hl(s) {
  const t = esc(s);
  if (!state.q) return t;
  const q = esc(state.q);
  return t.split(q).join(`<mark>${q}</mark>`);
}
function host(u) {
  try { return decodeURI(new URL(u).hostname).replace(/^www\./, ""); } catch { return u; }
}
// list=50音の品目（県へ行ける）／それ以外=県の行（品目名から50音へ戻れる）
function item(e, list) {
  const hs = e.urls.map(host), seen = {};
  const urls = e.urls.map((u, i) => {
    const h = hs[i], dup = hs.filter(x => x === h).length > 1;
    seen[h] = (seen[h] || 0) + 1;
    return `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(h)}${dup ? "（" + seen[h] + "）" : ""}</a>`;
  }).join("");
  const i = list ? IDX.get(e.name) : IDX.get(e.item);
  const name = !list && i != null ? `<button class="to" data-i="${i}">${hl(e.name)}</button>` : hl(e.name);
  const pfs = list ? `<div class="pfs"><span>都道府県別</span>`
    + e.prefs.map(p => `<button class="pf" data-i="${i}" data-p="${esc(p)}">${esc(p)}</button>`).join("") + `</div>` : "";
  const here = list ? e.name === state.here : !state.lit && e.item === state.here;
  return `<div class="item${here ? " here" : ""}"${list ? ` id="i-${i}"` : ""}><div class="name">${name}${e.bold ? '<span class="tag">複数地域</span>' : ""}</div>`
    + `<div class="desc">${hl(e.description)}</div>${pfs}<div class="urls">${urls}</div></div>`;
}

// 六角タイル
const TILES = {"北海道":[27,0],"青森":[25,1.25],"秋田":[24,2.25],"岩手":[26,2.25],"山形":[23,3.25],"宮城":[25,3.25],
  "新潟":[22,4.25],"栃木":[24,4.25],"福島":[26,4.25],"福井":[15,5.25],"石川":[17,5.25],"富山":[19,5.25],"群馬":[21,5.25],
  "埼玉":[23,5.25],"茨城":[25,5.25],"島根":[8,6.25],"鳥取":[10,6.25],"兵庫":[12,6.25],"京都":[14,6.25],"滋賀":[16,6.25],
  "岐阜":[18,6.25],"長野":[20,6.25],"山梨":[22,6.25],"東京":[24,6.25],"千葉":[26,6.25],"山口":[7,7.25],"広島":[9,7.25],
  "岡山":[11,7.25],"大阪":[13,7.25],"奈良":[15,7.25],"三重":[17,7.25],"愛知":[19,7.25],"静岡":[21,7.25],"神奈川":[23,7.25],
  "和歌山":[16,8.25],"佐賀":[4,8.45],"福岡":[6,8.45],"愛媛":[10,8.55],"香川":[12,8.55],"長崎":[3,9.45],"熊本":[5,9.45],
  "大分":[7,9.45],"高知":[11,9.55],"徳島":[13,9.55],"鹿児島":[4,10.45],"宮崎":[6,10.45],"沖縄":[1,11.2]};
const svg = $("#map");
(function buildMap() {
  const R = 33, HW = Math.sqrt(3) / 2 * R, VS = 1.5 * R, MX = 44, MY = 40;
  const hex = (cx, cy, r) => [0,1,2,3,4,5].map(i => {
    const a = Math.PI / 180 * (60 * i - 90);
    return (cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1);
  }).join(" ");
  let out = "";
  for (const [p, [q, r]] of Object.entries(TILES)) {
    const cx = (MX + q * HW).toFixed(1), cy = (MY + r * VS).toFixed(1);
    const lines = p.length >= 3 ? [p.slice(0, 2), p.slice(2)] : [p];
    const txt = lines.length === 1
      ? `<tspan x="${cx}" dy=".36em">${p}</tspan>`
      : `<tspan x="${cx}" dy="-.14em">${lines[0]}</tspan><tspan x="${cx}" dy="1.04em">${lines[1]}</tspan>`;
    out += `<g data-p="${p}"><polygon class="tile" tabindex="0" role="button" aria-label="${p}" points="${hex(+cx, +cy, R - 1.5)}"></polygon>`
      + `<text class="lbl" x="${cx}" y="${cy}" text-anchor="middle">${txt}</text></g>`;
  }
  svg.innerHTML = out;
})();
// 県名の文字は画面上でおよそ11pxに保つ（スマホで地図が縮んでも読める）
function fitLabels() {
  const w = svg.clientWidth;
  if (w) svg.style.setProperty("--lf", Math.min(20, Math.max(12, 11 * 804 / w)).toFixed(1) + "px");
  document.documentElement.style.setProperty("--hh", $("header").offsetHeight + "px");
  // 地図の下にある余白とフッターの分だけパネルを低くし、最後までスクロールしても固定位置から押し上げられないようにする
  document.documentElement.style.setProperty("--fh", $("footer").offsetHeight + parseFloat(getComputedStyle($("main")).paddingBottom) + "px");
}
new ResizeObserver(fitLabels).observe(svg);
new ResizeObserver(fitLabels).observe($("header"));
new ResizeObserver(fitLabels).observe($("footer"));

function paintMap() {
  const has = state.lit || state.q ? new Set(DATA.pref_entries.filter(phit).map(e => e.pref)) : null;
  svg.classList.toggle("searching", !!has);
  for (const g of svg.children) {
    const p = g.dataset.p, t = g.firstChild, off = !!has && !has.has(p);
    g.classList.toggle("off", off);
    t.classList.toggle("hit", !!has && has.has(p));
    t.classList.toggle("sel", p === state.pref);
    t.setAttribute("aria-pressed", p === state.pref);
    t.setAttribute("tabindex", off ? "-1" : "0");
  }
  return has;
}
function renderPanel(has) {
  const panel = $("#panel");
  if (!state.pref) {
    panel.innerHTML = `<p class="hint">${has && !has.size ? "見つかりませんでした" : "県を押すと、ここに一覧が出ます"}</p>`;
    return;
  }
  const es = DATA.pref_entries.filter(e => e.pref === state.pref && phit(e));
  panel.innerHTML = `<h2>${esc(state.pref)}</h2>` + (es.length ? es.map(e => item(e, false)).join("") : `<p class="hint">見つかりませんでした</p>`);
}
function pick(p) { state.pref = p; renderPanel(paintMap()); $("#panel").scrollTop = 0; }
svg.addEventListener("click", e => {
  const t = e.target.closest(".tile");
  if (t) pick(t.parentNode.dataset.p);
});
svg.addEventListener("keydown", e => {
  const t = e.target.closest && e.target.closest(".tile");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(t.parentNode.dataset.p); }
});

function renderList() {
  let html = "", n = 0;
  for (const g of GYO) {
    const es = DATA.items.filter(e => e.gyo === g && hit(e));
    if (!es.length) continue;
    n += es.length;
    html += `<h2 id="g-${g}">${g}</h2>` + es.map(e => item(e, true)).join("");
  }
  if (state.q) html = `<div class="count">${n}件（全${DATA.items.length}件中）</div>` + html;
  $("#list").innerHTML = n ? html : html + `<div class="empty">見つかりませんでした</div>`;
}
function renderNav() {
  if (state.tab !== "aiueo") { $("#nav").innerHTML = ""; return; }
  const has = new Set(DATA.items.filter(hit).map(e => e.gyo));
  $("#nav").innerHTML = GYO.map(g => `<button data-g="${g}" ${has.has(g) ? "" : "disabled"}>${g}</button>`).join("");
}
function renderLit() {
  $("#lit").innerHTML = state.tab === "map" && state.lit
    ? `<span>「${esc(state.lit)}」が載っている県</span><button type="button" id="unlit">解除</button>` : "";
}

function update() {
  const isMap = state.tab === "map";
  $("#mapview").hidden = !isMap;
  $("#list").hidden = isMap;
  renderNav();
  renderLit();
  if (isMap) renderPanel(paintMap()); else renderList();
}
function setTab(t) {
  state.tab = t;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", b.id === "tab-" + t));
}
function scrollToEl(el) {
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - $("header").offsetHeight - 4, behavior: "smooth" });
}

// 行き来の決まり：品目⇔県を行き来したら検索は外す。検索を打ち始めたら光らせは外す（最後に触った方が勝つ）
function clearQ() { state.q = ""; $("#q").value = ""; }
function goPref(p, i) {
  const it = DATA.items[i];
  clearQ();
  state.pref = p; state.lit = it.bold ? it.name : ""; state.here = it.name;
  setTab("map"); update(); window.scrollTo(0, 0);
  const panel = $("#panel"), el = panel.querySelector(".item.here");
  // 直前の送り量が残っていても目当ての行に合うよう、いまの位置からの差で送る
  panel.scrollTop = el ? panel.scrollTop + el.getBoundingClientRect().top - panel.getBoundingClientRect().top - 14 : 0;
  // スマホ（説明欄が地図の下に並ぶとき）は、目当ての行が画面の下に隠れていればそこまで送る
  if (el && getComputedStyle(panel).position !== "sticky" && el.getBoundingClientRect().bottom > window.innerHeight) scrollToEl(el);
}
function goItem(i) {
  clearQ();
  state.here = DATA.items[i].name;
  setTab("aiueo"); update();
  const el = document.getElementById("i-" + i);
  if (el) scrollToEl(el);
}

$("#q").addEventListener("input", e => { state.q = e.target.value.trim(); if (state.q) state.lit = ""; update(); });
for (const t of ["map", "aiueo"]) {
  $("#tab-" + t).addEventListener("click", () => { setTab(t); update(); window.scrollTo(0, 0); });
}
$("#nav").addEventListener("click", e => {
  const g = e.target.dataset && e.target.dataset.g;
  const h = g && document.getElementById("g-" + g);
  if (h) scrollToEl(h);
});
$("#lit").addEventListener("click", e => {
  if (e.target.id === "unlit") { state.lit = ""; update(); }
});
$("#list").addEventListener("click", e => {
  const b = e.target.closest(".pf");
  if (b) goPref(b.dataset.p, +b.dataset.i);
});
$("#panel").addEventListener("click", e => {
  const b = e.target.closest(".to");
  if (b) goItem(+b.dataset.i);
});

$("#notes").innerHTML = [
  `出典：${esc(DATA.publisher)}「${esc(DATA.title)}」${DATA.date.replace(/^(\d+)-0?(\d+)-0?(\d+)$/, "$1年$2月$3日")}。説明文・参照URLは原本のままです。`,
  `このページは日本醸造学会の公式サイトではありません。作成：<a href="https://sakenote.net/" target="_blank" rel="noopener">合同会社サケノテ</a>`,
  `50音順の注：${esc(DATA.notes.aiueo)}`,
  `都道府県別の注：${DATA.notes.pref.map(esc).join("")}`,
].map(s => `<p>${s}</p>`).join("");

update();
fitLabels();
</script>
